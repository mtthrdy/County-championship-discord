name: County Championship News

on:
  workflow_dispatch:

jobs:
  news:
    runs-on: ubuntu-latest

    steps:
      - name: Fetch cricket news
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python3 - <<'PY'
          import urllib.request
          import xml.etree.ElementTree as ET
          import json
          import os

          feeds = {
              "BBC Sport": "https://feeds.bbci.co.uk/sport/cricket/rss.xml",
              "ESPNcricinfo": "https://www.espncricinfo.com/rss/content/story/feeds/0.xml"
          }

          keywords = [
              "county championship",
              "county cricket",
              "division one",
              "division two",
              "surrey",
              "somerset",
              "yorkshire",
              "lancashire",
              "essex",
              "sussex",
              "hampshire",
              "nottinghamshire",
              "warwickshire",
              "glamorgan",
              "leicestershire",
              "durham",
              "worcestershire",
              "middlesex",
              "derbyshire",
              "northamptonshire",
              "kent",
              "gloucestershire"
          ]

          articles = []

          for source, url in feeds.items():
              try:
                  request = urllib.request.Request(
                      url,
                      headers={
                          "User-Agent": "Mozilla/5.0"
                      }
                  )

                  data = urllib.request.urlopen(
                      request,
                      timeout=20
                  ).read()

                  root = ET.fromstring(data)

                  for item in root.findall(".//item"):
                      title = item.findtext("title", "").strip()
                      link = item.findtext("link", "").strip()
                      description = item.findtext("description", "").strip()

                      text = (
                          title + " " + description
                      ).lower()

                      if any(
                          keyword in text
                          for keyword in keywords
                      ):
                          articles.append(
                              (source, title, link)
                          )

              except Exception as e:
                  print(f"Could not read {source}: {e}")

          if not articles:
              message = (
                  "🏏 **County Championship News Test**\n\n"
                  "No County Championship stories found "
                  "in the current feeds."
              )
          else:
              lines = [
                  "🏏 **COUNTY CHAMPIONSHIP NEWS TEST**",
                  ""
              ]

              seen = set()

              for source, title, link in articles:
                  if link in seen:
                      continue

                  seen.add(link)

                  lines.append(f"**{title}**")
                  lines.append(f"{source} • {link}")
                  lines.append("")

                  if len("\n".join(lines)) > 1800:
                      break

              message = "\n".join(lines)

          with open("discord-message.json", "w") as f:
              json.dump({"content": message}, f)

          print(message)
          PY

          curl -X POST \
            -H "Content-Type: application/json" \
            --data @discord-message.json \
            "$DISCORD_WEBHOOK_URL"
