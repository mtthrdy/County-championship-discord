name: County Championship News

on:
  workflow_dispatch:

jobs:
  news:
    runs-on: ubuntu-latest

    steps:
      - name: Fetch and format cricket news
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python3 - <<'PY'
          import urllib.request
          import xml.etree.ElementTree as ET
          import json
          import html
          import re
          from datetime import datetime, timezone, timedelta
          from email.utils import parsedate_to_datetime

          # Dedicated County Championship feeds are the primary source.
          # The global Cricinfo feed and BBC feed are retained as supplementary
          # sources so important stories are less likely to be missed.
          feeds = [
              ("ESPNcricinfo", "Division One", "https://www.espncricinfo.com/rss/content/story/feeds/1513323.xml"),
              ("ESPNcricinfo", "Division Two", "https://www.espncricinfo.com/rss/content/story/feeds/1513324.xml"),
              ("ESPNcricinfo", "General", "https://www.espncricinfo.com/rss/content/story/feeds/0.xml"),
              ("BBC Sport", "General", "https://feeds.bbci.co.uk/sport/cricket/rss.xml")
          ]

          counties = [
              "Surrey", "Somerset", "Yorkshire", "Lancashire",
              "Essex", "Sussex", "Hampshire", "Nottinghamshire",
              "Warwickshire", "Glamorgan", "Leicestershire", "Durham",
              "Worcestershire", "Middlesex", "Derbyshire",
              "Northamptonshire", "Kent", "Gloucestershire"
          ]

          championship_terms = [
              "county championship",
              "county championship division",
              "county cricket championship",
              "championship division"
          ]

          exclude_terms = [
              "t20 blast",
              "vitality blast",
              "the hundred",
              "hundred cricket",
              "county cup",
              "international",
              "test match",
              "odi",
              "one-day international",
              "t20 world cup",
              "women's cricket",
              "women’s cricket"
          ]

          now = datetime.now(timezone.utc)
          cutoff = now - timedelta(hours=24)
          articles = []

          def clean_text(value):
              value = html.unescape(value or "")
              value = re.sub(r"<[^>]+>", " ", value)
              value = re.sub(r"\s+", " ", value)
              return value.strip()

          def fetch_feed(source, division, url):
              try:
                  request = urllib.request.Request(
                      url,
                      headers={"User-Agent": "Mozilla/5.0"}
                  )
                  data = urllib.request.urlopen(request, timeout=20).read()
                  root = ET.fromstring(data)

                  for item in root.findall(".//item"):
                      title = clean_text(item.findtext("title", ""))
                      link = item.findtext("link", "").strip()
                      description = clean_text(item.findtext("description", ""))
                      pub_date = item.findtext("pubDate", "").strip()

                      if not title or not link or not pub_date:
                          continue

                      try:
                          published = parsedate_to_datetime(pub_date)
                          if published.tzinfo is None:
                              published = published.replace(tzinfo=timezone.utc)
                          published = published.astimezone(timezone.utc)
                      except Exception:
                          continue

                      if published < cutoff:
                          continue

                      text = (title + " " + description).lower()

                      if any(term in text for term in exclude_terms):
                          continue

                      if division == "General" and not any(
                          term in text for term in championship_terms
                      ):
                          continue

                      county_matches = [
                          county for county in counties
                          if re.search(r"\b" + re.escape(county.lower()) + r"\b", text)
                      ]

                      articles.append({
                          "source": source,
                          "division": division,
                          "title": title,
                          "description": description,
                          "link": link,
                          "published": published,
                          "counties": county_matches
                      })

              except Exception as e:
                  print(f"Could not read {source} {division}: {e}")

          for source, division, url in feeds:
              fetch_feed(source, division, url)

          # Remove duplicate stories.
          unique = []
          seen = set()

          for article in articles:
              key = article["link"].split("?")[0].rstrip("/")
              if key in seen:
                  continue
              seen.add(key)
              unique.append(article)

          # Editorial scoring: prioritise competition-defining events,
          # then major individual performances and dramatic results.
          importance_rules = [
              (r"\\bchampions?\\b", 20),
              (r"\\btitle\\b", 14),
              (r"\\bpromot(?:ed|ion)\\b", 18),
              (r"\\brelegat(?:ed|ion)\\b", 18),
              (r"\\bsurviv(?:e|es|ed|al)\\b", 12),
              (r"\\bfinal[- ]day\\b", 7),
              (r"\\binnings? (?:and|by)\\b", 8),
              (r"\\bone[- ]wicket\\b", 10),
              (r"\\b(?:two|three|four)[- ]wicket\\b", 5),
              (r"\\b(?:five|six|seven|eight|nine|ten)[- ]wicket\\b", 9),
              (r"\\bhat[- ]trick\\b", 12),
              (r"\\b\\d{3}\\b", 10),
              (r"\\b\\d{2,3}\\s*\\b(?:runs?|wickets?)\\b", 5),
              (r"\\bcentur(?:y|ies)\\b", 7),
              (r"\\bfive[- ]for\\b", 8),
              (r"\\brecord\\b", 7),
              (r"\\bthriller\\b", 7),
              (r"\\bdramatic\\b", 5),
              (r"\\bwin(?:s|ning)?\\b", 6),
              (r"\\bvictory\\b", 6),
              (r"\\bdefeat(?:s|ed)?\\b", 4),
              (r"\\bbeaten\\b", 4)
          ]

          for article in unique:
              haystack = (article["title"] + " " + article["description"]).lower()
              score = 0

              for pattern, points in importance_rules:
                  if re.search(pattern, haystack):
                      score += points

              # Dedicated series feeds are preferable to generic coverage.
              if article["division"] in ("Division One", "Division Two"):
                  score += 4

              # Freshness only breaks close calls; it should not overpower
              # genuinely important Championship developments.
              age_hours = max(
                  0,
                  (now - article["published"]).total_seconds() / 3600
              )
              score += max(0, 2 - age_hours / 12)

              article["score"] = score

          unique.sort(
              key=lambda x: (x["score"], x["published"]),
              reverse=True
          )

          articles = unique[:5]

          def summarise(article):
              description = article["description"]

              if not description:
                  return ""

              description = re.sub(r"\\s+", " ", description).strip()

              # Remove common RSS boilerplate and avoid repeating the headline.
              description = re.sub(
                  r"^(?:county championship|county cricket)[:\-–—]?\\s*",
                  "",
                  description,
                  flags=re.I
              )

              title_words = set(
                  re.findall(r"[a-z0-9']+", article["title"].lower())
              )
              sentences = re.split(r"(?<=[.!?])\\s+", description)

              useful = []
              for sentence in sentences:
                  sentence = sentence.strip()
                  if not sentence:
                      continue

                  words = set(
                      re.findall(r"[a-z0-9']+", sentence.lower())
                  )

                  # Skip a sentence that mostly repeats the headline.
                  overlap = len(title_words & words) / max(1, len(words))
                  if overlap >= 0.65 and useful:
                      continue

                  useful.append(sentence)

                  if len(" ".join(useful)) >= 260 or len(useful) >= 2:
                      break

              summary = " ".join(useful).strip()

              if len(summary) > 300:
                  summary = summary[:297].rsplit(" ", 1)[0] + "..."

              return summary

          def lead_story_intro(articles):
              if not articles:
                  return ""

              lead = articles[0]
              title = lead["title"]
              summary = summarise(lead)

              # A compact editorial intro that tells the reader why today's
              # lead story matters, without simply repeating its headline.
              if summary:
                  first_sentence = re.split(r"(?<=[.!?])\\s+", summary)[0]
                  return f"*The biggest story today: {first_sentence}*"
              return f"*The biggest story today is {title.lower()}.*"

          date_label = now.strftime("%d %B %Y")

          lines = [
              f"**County Championship Round-up - {now.strftime('%d %B %Y')}**",
              ""
          ]

          if articles:
              intro = lead_story_intro(articles)
              if intro:
                  lines.append(intro)
                  lines.append("")

              for index, article in enumerate(articles, 1):
                  summary = summarise(article)

                  if index == 1:
                      lines.append("**🏆 THE BIG STORY**")
                      lines.append("")

                  if summary:
                      lines.append(
                          f"**{index}. {article['title']}** — {summary}"
                      )
                  else:
                      lines.append(
                          f"**{index}. {article['title']}**"
                      )

                  lines.append(
                      f"*{article['source']} ·* **[Read the full story →]({article['link']})**"
                  )
                  lines.append("")

              lines.append(
                  f"*Top {len(articles)} County Championship stories from the last 24 hours*"
              )
          else:
              lines.append(
                  "No new County Championship stories were found in the last 24 hours."
              )

          message = "\n".join(lines)

          # Discord has a 2,000 character message limit.
          if len(message) > 1900:
              message = message[:1897].rsplit("\n", 1)[0] + "..."

          with open("discord-message.json", "w") as f:
              json.dump({
                  "content": message,
                  # Discord flag 4 suppresses automatic link preview embeds.
                  "flags": 4
              }, f)

          print(message)
          PY

          curl -X POST \
            -H "Content-Type: application/json" \
            --data @discord-message.json \
            "$DISCORD_WEBHOOK_URL"
