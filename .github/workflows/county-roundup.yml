name: County Championship News

on:
  workflow_dispatch:

jobs:
  news:
    runs-on: ubuntu-latest

    steps:
      - name: Fetch and format cricket news
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python3 - <<'PY'
          import urllib.request
          import xml.etree.ElementTree as ET
          import json
          import html
          import re
          from datetime import datetime, timezone, timedelta
          from email.utils import parsedate_to_datetime

          feeds = {
              "BBC Sport": "https://feeds.bbci.co.uk/sport/cricket/rss.xml",
              "ESPNcricinfo": "https://www.espncricinfo.com/rss/content/story/feeds/0.xml"
          }

          counties = [
              "Surrey", "Somerset", "Yorkshire", "Lancashire",
              "Essex", "Sussex", "Hampshire", "Nottinghamshire",
              "Warwickshire", "Glamorgan", "Leicestershire", "Durham",
              "Worcestershire", "Middlesex", "Derbyshire",
              "Northamptonshire", "Kent", "Gloucestershire"
          ]

          # Terms which strongly indicate the County Championship.
          championship_terms = [
              "county championship",
              "county championship division",
              "county cricket championship",
              "championship division"
          ]

          # Competitions/topics we definitely don't want.
          exclude_terms = [
              "t20 blast",
              "vitality blast",
              "the hundred",
              "hundred cricket",
              "county cup",
              "international",
              "test match",
              "odi",
              "one-day international",
              "t20 world cup",
              "women's cricket",
              "women’s cricket"
          ]

          now = datetime.now(timezone.utc)
          cutoff = now - timedelta(hours=24)

          articles = []

          for source, url in feeds.items():
              try:
                  request = urllib.request.Request(
                      url,
                      headers={"User-Agent": "Mozilla/5.0"}
                  )

                  data = urllib.request.urlopen(
                      request,
                      timeout=20
                  ).read()

                  root = ET.fromstring(data)

                  for item in root.findall(".//item"):

                      title = html.unescape(
                          item.findtext("title", "").strip()
                      )

                      link = item.findtext("link", "").strip()

                      description = html.unescape(
                          item.findtext("description", "").strip()
                      )

                      pub_date = item.findtext(
                          "pubDate", ""
                      ).strip()

                      if not title or not link or not pub_date:
                          continue

                      try:
                          published = parsedate_to_datetime(pub_date)

                          if published.tzinfo is None:
                              published = published.replace(
                                  tzinfo=timezone.utc
                              )

                          published = published.astimezone(
                              timezone.utc
                          )

                      except Exception:
                          continue

                      # Only consider the last 24 hours.
                      if published < cutoff:
                          continue

                      text = (
                          title + " " + description
                      ).lower()

                      # Exclude other competitions/topics.
                      if any(
                          term in text
                          for term in exclude_terms
                      ):
                          continue

                      # Require an explicit Championship reference.
                      if not any(
                          term in text
                          for term in championship_terms
                      ):
                          continue

                      county_matches = []

                      for county in counties:
                          if re.search(
                              r"\b" + re.escape(county.lower()) + r"\b",
                              text
                          ):
                              county_matches.append(county)

                      articles.append({
                          "source": source,
                          "title": title,
                          "link": link,
                          "published": published,
                          "counties": county_matches
                      })

              except Exception as e:
                  print(f"Could not read {source}: {e}")

          # Newest first.
          articles.sort(
              key=lambda x: x["published"],
              reverse=True
          )

          # Remove duplicate links.
          unique = []
          seen = set()

          for article in articles:
              if article["link"] in seen:
                  continue

              seen.add(article["link"])
              unique.append(article)

          # Maximum five stories.
          articles = unique[:5]

          today = now.strftime("%d %B %Y")

          lines = [
              "🏏 **COUNTY CHAMPIONSHIP MORNING BRIEF**",
              f"*{today}*",
              "",
              "📰 **Latest from the Championship**",
              ""
          ]

          if articles:

              for article in articles:

                  # The headline itself is the clickable link.
                  lines.append(
                      f"• **[{article['title']}]"
                      f"({article['link']})**"
                  )

                  county_text = ""

                  if article["counties"]:
                      county_text = (
                          " • " +
                          ", ".join(article["counties"][:3])
                      )

                  lines.append(
                      f"_{article['source']}{county_text}_"
                  )

                  lines.append("")

              lines.append(
                  f"*{len(articles)} stories from the last 24 hours*"
              )

          else:

              lines.append(
                  "No new County Championship stories "
                  "were found in the last 24 hours."
              )

          message = "\n".join(lines)

          # Stay safely below Discord's 2,000 character limit.
          message = message[:1900]

          with open("discord-message.json", "w") as f:
              json.dump(
                  {"content": message},
                  f
              )

          print(message)
          PY

          curl -X POST \
            -H "Content-Type: application/json" \
            --data @discord-message.json \
            "$DISCORD_WEBHOOK_URL"
