name: County Championship News

on:
  workflow_dispatch:

jobs:
  news:
    runs-on: ubuntu-latest

    steps:
      - name: Fetch and format cricket news
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python3 - <<'PY'
          import urllib.request
          import xml.etree.ElementTree as ET
          import json
          import os
          import html
          import re

          feeds = {
              "BBC Sport": "https://feeds.bbci.co.uk/sport/cricket/rss.xml",
              "ESPNcricinfo": "https://www.espncricinfo.com/rss/content/story/feeds/0.xml"
          }

          counties = [
              "Surrey",
              "Somerset",
              "Yorkshire",
              "Lancashire",
              "Essex",
              "Sussex",
              "Hampshire",
              "Nottinghamshire",
              "Warwickshire",
              "Glamorgan",
              "Leicestershire",
              "Durham",
              "Worcestershire",
              "Middlesex",
              "Derbyshire",
              "Northamptonshire",
              "Kent",
              "Gloucestershire"
          ]

          championship_terms = [
              "county championship",
              "county cricket",
              "division one",
              "division two"
          ]

          articles = []

          for source, url in feeds.items():
              try:
                  request = urllib.request.Request(
                      url,
                      headers={"User-Agent": "CountyChampionshipDiscord/1.0"}
                  )

                  data = urllib.request.urlopen(
                      request,
                      timeout=20
                  ).read()

                  root = ET.fromstring(data)

                  for item in root.findall(".//item"):
                      title = html.unescape(
                          item.findtext("title", "").strip()
                      )

                      link = item.findtext("link", "").strip()

                      description = html.unescape(
                          item.findtext("description", "").strip()
                      )

                      text = (
                          title + " " + description
                      ).lower()

                      county_matches = [
                          county for county in counties
                          if county.lower() in text
                      ]

                      championship_match = any(
                          term in text
                          for term in championship_terms
                      )

                      if county_matches or championship_match:
                          articles.append({
                              "source": source,
                              "title": title,
                              "link": link,
                              "counties": county_matches
                          })

              except Exception as e:
                  print(f"Could not read {source}: {e}")

          # Remove duplicate links
          unique = []
          seen = set()

          for article in articles:
              if article["link"] in seen:
                  continue

              seen.add(article["link"])
              unique.append(article)

          articles = unique[:12]

          if not articles:
              message = (
                  "🏏 **COUNTY CHAMPIONSHIP ROUND-UP**\n\n"
                  "No new County Championship stories were "
                  "found in the BBC Sport or ESPNcricinfo feeds."
              )

          else:
              lines = [
                  "🏏 **COUNTY CHAMPIONSHIP ROUND-UP**",
                  "",
                  "📰 **Latest stories**",
                  ""
              ]

              for article in articles:
                  county_text = ""

                  if article["counties"]:
                      county_text = (
                          " • " +
                          ", ".join(article["counties"])
                      )

                  lines.append(
                      f"**{article['title']}**"
                  )

                  lines.append(
                      f"_{article['source']}{county_text}_"
                  )

                  lines.append(
                      f"🔗 {article['link']}"
                  )

                  lines.append("")

              message = "\n".join(lines)

          # Keep safely below Discord's 2,000-character limit
          message = message[:1900]

          with open("discord-message.json", "w") as f:
              json.dump({"content": message}, f)

          print(message)
          PY

          curl -X POST \
            -H "Content-Type: application/json" \
            --data @discord-message.json \
            "$DISCORD_WEBHOOK_URL"
