name: County Championship Gameweek Threads

on:
  workflow_dispatch:
    inputs:
      gameweek:
        description: "Gameweek number to post (leave blank to use today's scheduled gameweek)"
        required: false
        type: string
      force:
        description: "Force a repost for testing (does not change posted-state)"
        required: false
        default: false
        type: boolean
  schedule:
    # Check each morning; the script only posts on the first day of a round.
    # 07:15 avoids the heavy load that can affect jobs at the top of the hour.
    - cron: "15 7 * * *"
      timezone: "Europe/London"

permissions:
  contents: write

concurrency:
  group: county-gameweek-threads
  cancel-in-progress: false

jobs:
  post-thread:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Create gameweek thread
        env:
          GAMEWEEK_THREADS_WEBHOOK_URL: ${{ secrets.GAMEWEEK_THREADS_WEBHOOK_URL }}
          GAMEWEEK_INPUT: ${{ inputs.gameweek }}
          FORCE_REPOST: ${{ inputs.force }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.request
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo

          WEBHOOK = os.environ.get("GAMEWEEK_THREADS_WEBHOOK_URL", "").strip()
          if not WEBHOOK:
              raise SystemExit("GAMEWEEK_THREADS_WEBHOOK_URL is not configured.")

          # 2026 Rothesay County Championship schedule, sourced from the ECB.
          # The division split is the 2026 structure; update this list when
          # the ECB publishes the following season's divisions and fixtures.
          ROUNDS = {
              1:  ("2026-04-03", "2026-04-06", [
                  ("Division One", [
                      ("Glamorgan", "Yorkshire"), ("Hampshire", "Essex"),
                      ("Leicestershire", "Sussex"), ("Somerset", "Nottinghamshire"),
                      ("Warwickshire", "Surrey")
                  ]),
                  ("Division Two", [
                      ("Derbyshire", "Worcestershire"), ("Durham", "Kent"),
                      ("Middlesex", "Gloucestershire"), ("Northamptonshire", "Lancashire")
                  ])
              ]),
              2:  ("2026-04-10", "2026-04-13", [
                  ("Division One", [
                      ("Essex", "Somerset"), ("Nottinghamshire", "Glamorgan"),
                      ("Surrey", "Leicestershire"), ("Sussex", "Warwickshire"),
                      ("Yorkshire", "Hampshire")
                  ]),
                  ("Division Two", [
                      ("Gloucestershire", "Durham"), ("Kent", "Northamptonshire"),
                      ("Lancashire", "Derbyshire"), ("Middlesex", "Worcestershire")
                  ])
              ]),
              3:  ("2026-04-17", "2026-04-20", [
                  ("Division One", [
                      ("Hampshire", "Somerset"), ("Warwickshire", "Essex")
                  ]),
                  ("Division Two", [
                      ("Gloucestershire", "Lancashire"), ("Northamptonshire", "Middlesex")
                  ])
              ]),
              4:  ("2026-04-24", "2026-04-27", [
                  ("Division One", [
                      ("Glamorgan", "Leicestershire"), ("Nottinghamshire", "Warwickshire"),
                      ("Surrey", "Essex"), ("Yorkshire", "Sussex")
                  ]),
                  ("Division Two", [
                      ("Derbyshire", "Gloucestershire"), ("Durham", "Lancashire"),
                      ("Worcestershire", "Kent")
                  ])
              ]),
              5:  ("2026-05-01", "2026-05-04", [
                  ("Division One", [
                      ("Hampshire", "Glamorgan"), ("Leicestershire", "Nottinghamshire"),
                      ("Somerset", "Yorkshire"), ("Surrey", "Sussex")
                  ]),
                  ("Division Two", [
                      ("Kent", "Derbyshire"), ("Middlesex", "Durham"),
                      ("Northamptonshire", "Worcestershire")
                  ])
              ]),
              6:  ("2026-05-08", "2026-05-11", [
                  ("Division One", [
                      ("Essex", "Hampshire"), ("Glamorgan", "Somerset"),
                      ("Nottinghamshire", "Surrey"), ("Sussex", "Leicestershire"),
                      ("Warwickshire", "Yorkshire")
                  ]),
                  ("Division Two", [
                      ("Derbyshire", "Northamptonshire"), ("Gloucestershire", "Kent"),
                      ("Lancashire", "Middlesex"), ("Worcestershire", "Durham")
                  ])
              ]),
              7:  ("2026-05-15", "2026-05-18", [
                  ("Division One", [
                      ("Essex", "Leicestershire"), ("Hampshire", "Nottinghamshire"),
                      ("Somerset", "Sussex"), ("Warwickshire", "Glamorgan"),
                      ("Yorkshire", "Surrey")
                  ]),
                  ("Division Two", [
                      ("Gloucestershire", "Northamptonshire"), ("Kent", "Durham"),
                      ("Lancashire", "Worcestershire"), ("Middlesex", "Derbyshire")
                  ])
              ]),
              8:  ("2026-06-07", "2026-06-10", [
                  ("Division One", [("Surrey", "Hampshire")]),
                  ("Division Two", [])
              ]),
              9:  ("2026-06-12", "2026-06-15", [
                  ("Division One", [
                      ("Leicestershire", "Essex"), ("Nottinghamshire", "Somerset"),
                      ("Sussex", "Glamorgan"), ("Yorkshire", "Warwickshire")
                  ]),
                  ("Division Two", [
                      ("Durham", "Derbyshire"), ("Lancashire", "Kent"),
                      ("Northamptonshire", "Gloucestershire"), ("Worcestershire", "Middlesex")
                  ])
              ]),
              10: ("2026-06-19", "2026-06-22", [
                  ("Division One", [
                      ("Essex", "Nottinghamshire"), ("Glamorgan", "Surrey"),
                      ("Leicestershire", "Yorkshire"), ("Somerset", "Warwickshire"),
                      ("Sussex", "Hampshire")
                  ]),
                  ("Division Two", [
                      ("Derbyshire", "Lancashire"), ("Durham", "Northamptonshire"),
                      ("Kent", "Middlesex"), ("Worcestershire", "Gloucestershire")
                  ])
              ]),
              11: ("2026-08-20", "2026-08-23", [
                  ("Division One", [
                      ("Hampshire", "Yorkshire"), ("Leicestershire", "Glamorgan"),
                      ("Somerset", "Essex"), ("Surrey", "Nottinghamshire"),
                      ("Warwickshire", "Sussex")
                  ]),
                  ("Division Two", [
                      ("Derbyshire", "Durham"), ("Gloucestershire", "Worcestershire"),
                      ("Lancashire", "Northamptonshire"), ("Middlesex", "Kent")
                  ])
              ]),
              12: ("2026-08-27", "2026-08-30", [
                  ("Division One", [
                      ("Essex", "Surrey"), ("Glamorgan", "Hampshire"),
                      ("Sussex", "Somerset"), ("Warwickshire", "Nottinghamshire"),
                      ("Yorkshire", "Leicestershire")
                  ]),
                  ("Division Two", [
                      ("Derbyshire", "Middlesex"), ("Durham", "Gloucestershire"),
                      ("Northamptonshire", "Kent"), ("Worcestershire", "Lancashire")
                  ])
              ]),
              13: ("2026-09-02", "2026-09-05", [
                  ("Division One", [
                      ("Essex", "Sussex"), ("Hampshire", "Warwickshire"),
                      ("Nottinghamshire", "Leicestershire"), ("Somerset", "Glamorgan"),
                      ("Surrey", "Yorkshire")
                  ]),
                  ("Division Two", [
                      ("Gloucestershire", "Derbyshire"), ("Kent", "Worcestershire"),
                      ("Middlesex", "Lancashire"), ("Northamptonshire", "Durham")
                  ])
              ]),
              14: ("2026-09-08", "2026-09-11", [
                  ("Division One", [
                      ("Glamorgan", "Warwickshire"), ("Leicestershire", "Somerset"),
                      ("Nottinghamshire", "Hampshire"), ("Sussex", "Surrey"),
                      ("Yorkshire", "Essex")
                  ]),
                  ("Division Two", [
                      ("Derbyshire", "Kent"), ("Durham", "Middlesex"),
                      ("Lancashire", "Gloucestershire"), ("Worcestershire", "Northamptonshire")
                  ])
              ]),
              15: ("2026-09-15", "2026-09-18", [
                  ("Division One", [
                      ("Essex", "Warwickshire"), ("Leicestershire", "Hampshire"),
                      ("Surrey", "Glamorgan"), ("Sussex", "Nottinghamshire"),
                      ("Yorkshire", "Somerset")
                  ]),
                  ("Division Two", [
                      ("Durham", "Worcestershire"), ("Gloucestershire", "Middlesex"),
                      ("Kent", "Lancashire"), ("Northamptonshire", "Derbyshire")
                  ])
              ]),
              16: ("2026-09-24", "2026-09-27", [
                  ("Division One", [
                      ("Glamorgan", "Essex"), ("Hampshire", "Sussex"),
                      ("Nottinghamshire", "Yorkshire"), ("Somerset", "Surrey"),
                      ("Warwickshire", "Leicestershire")
                  ]),
                  ("Division Two", [
                      ("Kent", "Gloucestershire"), ("Lancashire", "Durham"),
                      ("Middlesex", "Northamptonshire"), ("Worcestershire", "Derbyshire")
                  ])
              ])
          }

          # Venue information for each 2026 fixture.
          VENUES = {
              ("Glamorgan", "Essex"): "Sophia Gardens, Cardiff",
              ("Hampshire", "Sussex"): "Utilita Bowl, Southampton",
              ("Kent", "Gloucestershire"): "St Lawrence Ground, Canterbury",
              ("Lancashire", "Durham"): "Emirates Old Trafford, Manchester",
              ("Middlesex", "Northamptonshire"): "Lord's, London",
              ("Nottinghamshire", "Yorkshire"): "Trent Bridge, Nottingham",
              ("Somerset", "Surrey"): "Cooper Associates County Ground, Taunton",
              ("Warwickshire", "Leicestershire"): "Edgbaston, Birmingham",
              ("Worcestershire", "Derbyshire"): "Visit Worcestershire New Road, Worcester",
          }
          START_TIME = "10:30"

          # Official county YouTube channels used for home-team live streams.
          YOUTUBE_CHANNELS = {
              "Derbyshire": "https://www.youtube.com/@DerbyshireCCC",
              "Durham": "https://www.youtube.com/@DurhamCricket",
              "Essex": "https://www.youtube.com/@EssexCricketTV",
              "Glamorgan": "https://www.youtube.com/@GlamorganCricket",
              "Gloucestershire": "https://www.youtube.com/@GloucestershireCricket",
              "Hampshire": "https://www.youtube.com/@hantscricket",
              "Kent": "https://www.youtube.com/@kentcricket",
              "Lancashire": "https://www.youtube.com/channel/UCFNf9wV2ShfzFlFAK4elXyA",
              "Leicestershire": "https://www.youtube.com/@leicestershireccc",
              "Middlesex": "https://www.youtube.com/@MiddlesexCCC",
              "Northamptonshire": "https://www.youtube.com/@NorthantsCricket",
              "Nottinghamshire": "https://www.youtube.com/@NottsOutlaws",
              "Somerset": "https://www.youtube.com/@SomersetCricket",
              "Surrey": "https://www.youtube.com/@surreycricket",
              "Sussex": "https://www.youtube.com/@sussexccc",
              "Warwickshire": "https://www.youtube.com/@WarwickshireCCC",
              "Worcestershire": "https://www.youtube.com/@WorcsCCC",
              "Yorkshire": "https://www.youtube.com/@YorkshireCCC",
          }

          STATE_PATH = "data/gameweek-threads-seen.json"
          os.makedirs("data", exist_ok=True)
          try:
              with open(STATE_PATH, "r", encoding="utf-8") as f:
                  seen = json.load(f)
          except Exception:
              seen = {}
          if not isinstance(seen, dict):
              seen = {}

          london_now = datetime.now(timezone.utc).astimezone(ZoneInfo("Europe/London"))
          input_gameweek = os.environ.get("GAMEWEEK_INPUT", "").strip()

          if input_gameweek:
              try:
                  gameweek = int(input_gameweek)
              except ValueError:
                  raise SystemExit("Gameweek must be a number from 1 to 16.")
          else:
              gameweek = None
              today = london_now.date().isoformat()
              for number, (start, end, _) in ROUNDS.items():
                  if start == today:
                      gameweek = number
                      break

              if gameweek is None:
                  print(f"No gameweek starts today ({today}). Nothing to post.")
                  raise SystemExit(0)

          if gameweek not in ROUNDS:
              raise SystemExit(f"Gameweek {gameweek} is not in the configured 2026 schedule.")

          start, end, divisions = ROUNDS[gameweek]

          force_repost = os.environ.get("FORCE_REPOST", "").strip().lower() == "true"

          if str(gameweek) in seen and not force_repost:
              print(f"Gameweek {gameweek} has already been posted. Nothing to do.")
              raise SystemExit(0)

          if force_repost:
              print(f"Force repost enabled for Gameweek {gameweek}.")

          def display_date(iso_date):
              return datetime.fromisoformat(iso_date).strftime("%-d %B")

          # Keep the post close to the Reddit daily discussion format:
          # clear title, short intro, fixtures by division, then useful links.
          lines = [
              f"🏏 **ROTHESAY COUNTY CHAMPIONSHIP — GAMEWEEK {gameweek}**",
              f"📅 *{display_date(start)} – {display_date(end)}*",
              "",
              "## Gameweek Primer",
              "",
              "Welcome to the Gameweek "
              + str(gameweek)
              + " primer.",
              "",
              "Use this post for score updates, wickets, milestones, selection news, weather, tactical chat "
                "and all the inevitable County Championship overreactions.",
              "",
          ]

          for division_name, fixtures in divisions:
              lines.append(f"**{division_name.upper()} 🏏**")
              lines.append("")
              if not fixtures:
                  lines.append("_No fixtures scheduled._")
              else:
                  for home, away in fixtures:
                      lines.append(f"**{home} v {away}**")
              lines.append("")

          lines.extend([
              "---",
              "**USEFUL LINKS**",
              "🔗 [ECB Match Centre](https://www.ecb.co.uk/championship-live)",
              "🔗 [ECB Fixtures](https://www.ecb.co.uk/county-championship/fixtures)",
              "🔗 [ECB Tables](https://www.ecb.co.uk/county-championship/tables)",
              "🔗 [ESPNcricinfo — Division One](https://www.espncricinfo.com/series/county-championship-division-one-2026-1513323)",
              "🔗 [ESPNcricinfo — Division Two](https://www.espncricinfo.com/series/county-championship-division-two-2026-1513324)",
              "🔗 [BBC Sport Cricket](https://www.bbc.co.uk/sport/cricket)",
              "",
              "💬 **Discuss the action in #county-championship, #matchday or your county channel.**"
          ])

          message = "\n".join(lines)

          # Keep the useful-links section intact. Discord caps normal messages at 2,000 characters.
          if len(message) > 1900:
              raise SystemExit(f"Gameweek post is too long ({len(message)} characters). Shorten the body before posting.")

          payload = json.dumps({
              "content": message,
              "flags": 4
          }).encode("utf-8")

          request = urllib.request.Request(
              WEBHOOK,
              data=payload,
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "Mozilla/5.0 (County Championship Discord Bot)"
              },
              method="POST"
          )

          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  print(f"Discord response: {response.status}")
          except Exception as e:
              print(f"Discord delivery failed: {e}")
              raise

          if not force_repost:
              seen[str(gameweek)] = datetime.now(timezone.utc).isoformat()
              with open(STATE_PATH, "w", encoding="utf-8") as f:
                  json.dump(seen, f, indent=2)
          PY

      - name: Save posted-state
        run: |
          git add data/gameweek-threads-seen.json

          if git diff --cached --quiet -- data/gameweek-threads-seen.json; then
            echo "No state changes to commit."
            exit 0
          fi

          git config user.name "County Championship Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Track County Championship gameweek thread"
          git push
