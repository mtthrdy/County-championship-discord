name: Test Discord Webhook

on:
  workflow_dispatch:

jobs:
  send-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Send test message to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL is not configured."
            exit 1
          fi
          curl --fail --silent --show-error --retry 2 --retry-delay 2 \
            -H "Content-Type: application/json" \
            -d '{"content":"🏏 Test message from the County Championship Discord automation! If you can see this, it works."}' \
            "$DISCORD_WEBHOOK_URL"
