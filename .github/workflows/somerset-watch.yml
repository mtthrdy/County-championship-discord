name: County Website Watch

on:
  workflow_dispatch:
  schedule:
    # Run at 09:00 Europe/London year-round; GitHub handles BST/GMT.
    - cron: "0 9 * * *"
      timezone: "Europe/London"

permissions:
  contents: write

concurrency:
  group: county-website-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Install parser
        run: python -m pip install --disable-pip-version-check beautifulsoup4

      - name: Collect new county news
        env:
          SOMERSET_WEBHOOK_URL: ${{ secrets.SOMERSET_WEBHOOK_URL }}
          DERBYSHIRE_WEBHOOK_URL: ${{ secrets.DERBYSHIRE_WEBHOOK_URL }}
          DURHAM_WEBHOOK_URL: ${{ secrets.DURHAM_WEBHOOK_URL }}
          ESSEX_WEBHOOK_URL: ${{ secrets.ESSEX_WEBHOOK_URL }}
          GLAMORGAN_WEBHOOK_URL: ${{ secrets.GLAMORGAN_WEBHOOK_URL }}
          GLOUCESTERSHIRE_WEBHOOK_URL: ${{ secrets.GLOUCESTERSHIRE_WEBHOOK_URL }}
          LEICESTERSHIRE_WEBHOOK_URL: ${{ secrets.LEICESTERSHIRE_WEBHOOK_URL }}
          MIDDLESEX_WEBHOOK_URL: ${{ secrets.MIDDLESEX_WEBHOOK_URL }}
          NORTHAMPTONSHIRE_WEBHOOK_URL: ${{ secrets.NORTHAMPTONSHIRE_WEBHOOK_URL }}
          SUSSEX_WEBHOOK_URL: ${{ secrets.SUSSEX_WEBHOOK_URL }}
          YORKSHIRE_WEBHOOK_URL: ${{ secrets.YORKSHIRE_WEBHOOK_URL }}
          WORCESTERSHIRE_WEBHOOK_URL: ${{ secrets.WORCESTERSHIRE_WEBHOOK_URL }}
          WARWICKSHIRE_WEBHOOK_URL: ${{ secrets.WARWICKSHIRE_WEBHOOK_URL }}
          HAMPSHIRE_WEBHOOK_URL: ${{ secrets.HAMPSHIRE_WEBHOOK_URL }}
          KENT_WEBHOOK_URL: ${{ secrets.KENT_WEBHOOK_URL }}
          LANCASHIRE_WEBHOOK_URL: ${{ secrets.LANCASHIRE_WEBHOOK_URL }}
          NOTTINGHAMSHIRE_WEBHOOK_URL: ${{ secrets.NOTTINGHAMSHIRE_WEBHOOK_URL }}
          SURREY_WEBHOOK_URL: ${{ secrets.SURREY_WEBHOOK_URL }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          import urllib.parse
          import urllib.request
          import urllib.error
          import xml.etree.ElementTree as ET
          from datetime import datetime, timezone, timedelta
          from email.utils import parsedate_to_datetime

          from bs4 import BeautifulSoup

          ALL_COUNTIES = [
              ("Somerset", "https://somersetcountycc.co.uk/news/", r"/news/", "SOMERSET_WEBHOOK_URL"),
              ("Derbyshire", "https://derbyshireccc.com/news/", r"/\d{4}/\d{2}/", "DERBYSHIRE_WEBHOOK_URL"),
              ("Durham", "https://www.durhamcricket.co.uk/news-and-media/", r"/news-and-media/(?!news/?$|match-reports/?$|match-previews/?$|international/?$|video/?$|t20-blast/?$|interviews/?$|features/?$|foundation/?$|events/?$|partners-news/?$|recreational/?$|women/?$|representative/?$)[^/]+/?$", "DURHAM_WEBHOOK_URL"),
              ("Essex", "https://essexcricket.org.uk/news/", r"/\d{4}/\d{2}/\d{2}/[^/]+/?$", "ESSEX_WEBHOOK_URL"),
              ("Gloucestershire", "https://www.gloscricket.co.uk/news/", r"/news/.+", "GLOUCESTERSHIRE_WEBHOOK_URL"),
              ("Leicestershire", "https://leicestershireccc.co.uk/news", r"/news/.+", "LEICESTERSHIRE_WEBHOOK_URL"),
              ("Middlesex", "https://www.middlesexccc.com/news", r"/news/.+", "MIDDLESEX_WEBHOOK_URL"),
              ("Northamptonshire", "https://nccc.co.uk/", r"/news/.+", "NORTHAMPTONSHIRE_WEBHOOK_URL"),
              ("Sussex", "https://sussexcricket.co.uk/", r"/news/.+", "SUSSEX_WEBHOOK_URL"),
              ("Yorkshire", "https://yorkshireccc.com/news/", r"/news/.+", "YORKSHIRE_WEBHOOK_URL"),
              ("Worcestershire", "https://wccc.co.uk/news/", r"/news/.+", "WORCESTERSHIRE_WEBHOOK_URL"),
              ("Warwickshire", "https://www.edgbaston.com/warwickshire-ccc/news", r"/(?:warwickshire-ccc/)?media-article/[^/]+/?$", "WARWICKSHIRE_WEBHOOK_URL"),
              ("Hampshire", "https://www.utilitabowl.com/cricket/news/", r"/cricket/news/[^/]+/?$", "HAMPSHIRE_WEBHOOK_URL"),
              ("Kent", "https://www.kentcricket.co.uk/news/", r"/news/.+", "KENT_WEBHOOK_URL"),
              ("Lancashire", "https://cricket.lancashirecricket.co.uk/news/", r"/news/\d{4}-news/[^/]+/?$", "LANCASHIRE_WEBHOOK_URL"),
              ("Nottinghamshire", "https://www.trentbridge.co.uk/news/", r"/news/\d{4}/[^/]+/[^/]+\.html$", "NOTTINGHAMSHIRE_WEBHOOK_URL"),
              ("Surrey", "https://www.kiaoval.com/latest-news/", r"/[^/]+/?$", "SURREY_WEBHOOK_URL"),
              ("Glamorgan", "https://www.glamorgancricket.com/news/", r"/news/.+", "GLAMORGAN_WEBHOOK_URL")
          ]

          # Only run counties whose website source is still being debugged.
          # Keep the full configuration above so solved counties can be re-enabled
          # by adding their names here rather than rebuilding their entries.
          ACTIVE_COUNTIES = {
              "Gloucestershire",
              "Hampshire",
              "Glamorgan",
          }
          COUNTIES = [county for county in ALL_COUNTIES if county[0] in ACTIVE_COUNTIES]

          # The bot is intended for county men's cricket and significant club news.
          # Commercial, ticketing, hospitality, community and women's-only articles
          # are filtered unless the article is clearly about the men's first team.
          EXCLUDE_TERMS = [
              "women's cricket", "women’s cricket", "women's team", "women’s team",
              "women v", "women vs", "women's ", "women’s ", "women ",
              "female ", "girls ", "girls'", "ladies", "foundation", "community",
              "hospitality", "membership", "ticket", "tickets", "christmas",
              "vacancy", "job opportunity", "commercial partner", "sponsorship"
          ]

          IMPORTANT_TERMS = [
              "county championship", "first team", "men's", "men’s", "sign",
              "signs", "contract", "extend", "extension", "leave", "leaves",
              "retire", "retirement", "injury", "squad", "match report",
              "match preview", "century", "five-for", "six-for", "wicket",
              "victory", "win", "defeat", "champions", "promotion", "relegation",
              "chair", "chairman", "director", "ceo", "chief executive",
              "appointed", "appointment", "resign", "resignation", "step down"
          ]

          STATE_PATH = "data/county-watch-seen.json"
          os.makedirs("data", exist_ok=True)

          try:
              with open(STATE_PATH, "r", encoding="utf-8") as f:
                  seen = json.load(f)
          except Exception:
              seen = {}

          def fetch(url, timeout=12):
              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "Mozilla/5.0 (County Championship Discord Bot)"
                  }
              )
              with urllib.request.urlopen(request, timeout=timeout) as response:
                  return response.read()

          def clean(text):
              return re.sub(r"\s+", " ", text or "").strip()

          def parse_date(value):
              if not value:
                  return None
              value = value.strip()
              try:
                  dt = datetime.fromisoformat(value.replace("Z", "+00:00"))
                  if dt.tzinfo is None:
                      dt = dt.replace(tzinfo=timezone.utc)
                  return dt.astimezone(timezone.utc)
              except Exception:
                  pass
              try:
                  dt = parsedate_to_datetime(value)
                  if dt.tzinfo is None:
                      dt = dt.replace(tzinfo=timezone.utc)
                  return dt.astimezone(timezone.utc)
              except Exception:
                  pass

              # Some county sites expose dates as human-readable text,
              # e.g. "24 September 26".
              value = re.sub(r"^(?:Mon(?:day)?|Tue(?:sday)?|Wed(?:nesday)?|Thu(?:rsday)?|Fri(?:day)?|Sat(?:urday)?|Sun(?:day)?)\s+", "", value, flags=re.I)
              value = re.sub(r"\b(\d{1,2})(st|nd|rd|th)\b", r"\1", value, flags=re.I)
              for fmt in ("%d %B %y", "%d %B %Y", "%d %b %y", "%d %b %Y", "%B %d, %Y", "%b %d, %Y",
                          "%d/%m/%Y", "%d/%m/%y", "%d.%m.%Y", "%d-%m-%Y", "%Y-%m-%d"):
                  try:
                      dt = datetime.strptime(value, fmt).replace(tzinfo=timezone.utc)
                      return dt
                  except Exception:
                      continue

              return None

          def article_metadata(url, html):
              soup = BeautifulSoup(html, "html.parser")

              # Reject section/index pages masquerading as stories.
              page_path = urllib.parse.urlparse(url).path.rstrip("/")
              if page_path in {"/news", "/latest-news", "/cricket/news"}:
                  return "", "", None

              title = ""
              h1 = soup.find("h1")
              if h1:
                  title = clean(h1.get_text(" ", strip=True))

              if not title and soup.find("meta", property="og:title"):
                  title = clean(soup.find("meta", property="og:title").get("content", ""))

              if not title and soup.title:
                  title = clean(soup.title.get_text(" ", strip=True))

              description = ""
              meta = soup.find("meta", attrs={"name": "description"})
              if meta:
                  description = clean(meta.get("content", ""))

              published = None

              # Some sites expose the publication date in a <time datetime="..."> element.
              time_tag = soup.find("time", attrs={"datetime": True})
              if time_tag:
                  published = parse_date(time_tag.get("datetime", ""))

              # Prefer structured article metadata when the page provides it.
              for script in soup.find_all("script", type="application/ld+json"):
                  try:
                      data = json.loads(script.string or script.get_text())
                  except Exception:
                      continue

                  objects = data if isinstance(data, list) else [data]
                  for obj in objects:
                      if isinstance(obj, dict):
                          if not description and obj.get("description"):
                              description = clean(str(obj["description"]))
                          if obj.get("datePublished") and not published:
                              published = parse_date(str(obj["datePublished"]))

              # If there is still no description, use the opening paragraph(s)
              # from the article itself as the story summary.
              if not description:
                  article_root = soup.find("article") or soup.find("main") or soup
                  paragraphs = []
                  for p in article_root.find_all("p"):
                      text = clean(p.get_text(" ", strip=True))
                      if len(text) >= 40 and text.lower() != title.lower():
                          paragraphs.append(text)
                      if len(paragraphs) == 2:
                          break
                  description = " ".join(paragraphs)

              for meta_name in ["article:published_time", "datePublished", "pubdate"]:
                  tag = soup.find("meta", property=meta_name) or soup.find("meta", attrs={"name": meta_name})
                  if tag:
                      published = parse_date(tag.get("content", ""))
                      if published:
                          break

              # Many county sites expose datePublished in JSON-LD.
              for script in soup.find_all("script", type="application/ld+json"):
                  if published:
                      break
                  try:
                      data = json.loads(script.string or script.get_text())
                  except Exception:
                      continue

                  objects = data if isinstance(data, list) else [data]
                  for obj in objects:
                      if isinstance(obj, dict) and obj.get("datePublished"):
                          published = parse_date(str(obj["datePublished"]))
                          if published:
                              break

              # Final fallback: only inspect the article/header area for a visible date.
              # Searching the whole page is unsafe because navigation, footer and
              # event pages often contain unrelated future/past dates.
              if not published:
                  scope_texts = []

                  article = soup.find("article")
                  if article:
                      scope_texts.append(clean(article.get_text(" ", strip=True)))

                  h1 = soup.find("h1")
                  if h1:
                      node = h1
                      for _ in range(4):
                          if node and getattr(node, "get_text", None):
                              text_value = clean(node.get_text(" ", strip=True))
                              if text_value:
                                  scope_texts.append(text_value)
                          node = getattr(node, "parent", None)

                  for scope_text in scope_texts:
                      if not scope_text:
                          continue

                      relative = re.search(
                          r"\b(?:about\s+)?(\d+)\s*(hour|hours|day|days)\s+ago\b",
                          scope_text,
                          re.I
                      )
                      if relative:
                          amount = int(relative.group(1))
                          unit = relative.group(2).lower()
                          delta = timedelta(hours=amount) if unit.startswith("hour") else timedelta(days=amount)
                          published = now - delta
                          break

                      numeric_date = re.search(
                          r"\b(\d{1,2})[./-](\d{1,2})[./-](20\d{2})\b",
                          scope_text
                      )
                      if numeric_date:
                          date_text = f"{numeric_date.group(1)}/{numeric_date.group(2)}/{numeric_date.group(3)}"
                          for date_fmt in ("%d/%m/%Y",):
                              try:
                                  published = datetime.strptime(date_text, date_fmt).replace(tzinfo=timezone.utc)
                                  break
                              except Exception:
                                  pass
                          if published:
                              break

                      month_first = re.search(
                          r"\b(January|February|March|April|May|June|July|August|September|October|November|December|"
                          r"Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\s+"
                          r"(\d{1,2})(?:st|nd|rd|th)?,\s+(20\d{2})\b",
                          scope_text,
                          re.I
                      )
                      if month_first:
                          date_text = f"{month_first.group(2)} {month_first.group(1)} {month_first.group(3)}"
                          for date_fmt in ("%d %B %Y", "%d %b %Y"):
                              try:
                                  published = datetime.strptime(date_text, date_fmt).replace(tzinfo=timezone.utc)
                                  break
                              except Exception:
                                  continue
                          if published:
                              break

                      day_first = re.search(
                          r"\b(\d{1,2})(?:st|nd|rd|th)?\s+"
                          r"(January|February|March|April|May|June|July|August|September|October|November|December|"
                          r"Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\s+(20\d{2})\b",
                          scope_text,
                          re.I
                      )
                      if day_first:
                          date_text = f"{day_first.group(1)} {day_first.group(2)} {day_first.group(3)}"
                          for date_fmt in ("%d %B %Y", "%d %b %Y"):
                              try:
                                  published = datetime.strptime(date_text, date_fmt).replace(tzinfo=timezone.utc)
                                  break
                              except Exception:
                                  continue
                          if published:
                              break

              # Some modern club pages keep publication metadata in
              # generic application scripts rather than JSON-LD. Inspect raw
              # HTML for an explicit datePublished field before giving up.
              if not published:
                  html_text = html.decode("utf-8", errors="replace") if isinstance(html, bytes) else str(html)
                  raw_date = re.search(
                      r'"datePublished"\s*:\s*"([^"]+)"',
                      html_text,
                      re.I
                  )
                  if raw_date:
                      published = parse_date(raw_date.group(1))

              return title, description, published

          def espncricinfo_fallback(county):
              # Used only when the official county site returns HTTP 403.
              # Google News RSS is used as a discovery layer, restricted to
              # ESPNcricinfo results for this specific county.
              query = f'site:espncricinfo.com "{county}" cricket'
              rss_url = (
                  "https://news.google.com/rss/search?q="
                  + urllib.parse.quote(query)
                  + "&hl=en-GB&gl=GB&ceid=GB:en"
              )

              stories = []
              try:
                  xml = fetch(rss_url).decode("utf-8", errors="replace")
                  root = ET.fromstring(xml)
              except Exception as e:
                  print(f"{county}: ESPNcricinfo fallback failed: {e}")
                  return stories

              for item in root.findall(".//item")[:5]:
                  title = clean(item.findtext("title", ""))
                  link = clean(item.findtext("link", ""))
                  pub_date = parse_date(item.findtext("pubDate", ""))
                  description = clean(BeautifulSoup(
                      item.findtext("description", ""), "html.parser"
                  ).get_text(" ", strip=True))

                  source = item.find("source")
                  source_name = clean(source.text if source is not None else "")
                  if source_name.lower() != "espncricinfo":
                      continue

                  # Resolve the Google News redirect so Discord links go
                  # directly to ESPNcricinfo where possible.
                  if link:
                      try:
                          request = urllib.request.Request(
                              link,
                              headers={"User-Agent": "Mozilla/5.0 (County Championship Discord Bot)"}
                          )
                          with urllib.request.urlopen(request, timeout=10) as response:
                              resolved = response.geturl()
                              if "espncricinfo.com" in urllib.parse.urlparse(resolved).netloc:
                                  link = resolved.split("#", 1)[0]
                      except Exception:
                          pass

                  if not link or "espncricinfo.com" not in urllib.parse.urlparse(link).netloc:
                      continue

                  text = f"{title} {description}".lower()
                  county_term = county.lower()
                  if county_term not in text:
                      continue
                  if any(term in text for term in EXCLUDE_TERMS):
                      continue
                  if not pub_date:
                      continue
                  if pub_date < cutoff or pub_date > now + timedelta(minutes=10):
                      continue

                  if title.strip().lower() in {
                      "somerset county cricket club | news and updates",
                      "somerset county cricket club - news and updates"
                  }:
                      print(f"{county}: skipped generic news index page: {title}")
                      continue

                  score = sum(1 for term in IMPORTANT_TERMS if term in text)
                  if score == 0:
                      continue

                  stories.append({
                      "county": county,
                      "title": title,
                      "description": description,
                      "link": link,
                      "published": pub_date,
                      "score": score
                  })

              unique = {}
              for story in stories:
                  unique[story["link"]] = story

              result = sorted(
                  unique.values(),
                  key=lambda x: (x["score"], x["published"]),
                  reverse=True
              )[:8]

              print(f"{county}: ESPNcricinfo fallback found {len(result)} candidate stories.")
              return result

          def resolve_search_result(link, domain):
              """Resolve search-engine links to the official county article where possible."""
              if not link:
                  return None

              parsed = urllib.parse.urlparse(link)

              # Bing RSS wraps the destination in /news/apiclick.aspx?url=...
              if parsed.netloc.lower().removeprefix("www.") == "bing.com" and parsed.path == "/news/apiclick.aspx":
                  target = urllib.parse.parse_qs(parsed.query).get("url", [None])[0]
                  if target:
                      link = urllib.parse.unquote(target)

              try:
                  request = urllib.request.Request(
                      link,
                      headers={"User-Agent": "Mozilla/5.0 (County Championship Discord Bot)"}
                  )
                  with urllib.request.urlopen(request, timeout=8) as response:
                      resolved = response.geturl().split("#", 1)[0]
              except Exception:
                  resolved = link.split("#", 1)[0]

              host = urllib.parse.urlparse(resolved).netloc.lower().removeprefix("www.")
              if host == domain or host.endswith("." + domain):
                  return resolved

              return None

          def search_news_rss(engine, query):
              """Return parsed RSS news results from Google News or Bing News."""
              encoded_query = urllib.parse.quote(query)

              if engine == "google":
                  rss_url = (
                      "https://news.google.com/rss/search?q="
                      + encoded_query
                      + "&hl=en-GB&gl=GB&ceid=GB:en"
                  )
              else:
                  rss_url = (
                      "https://www.bing.com/news/search?q="
                      + encoded_query
                      + "&qft=sortbydate%3d%221%22&format=RSS&mkt=en-GB"
                  )

              try:
                  xml = fetch(rss_url, timeout=12).decode("utf-8", errors="replace")
                  root = ET.fromstring(xml)
                  print(f"{engine} news search returned {len(root.findall('.//item'))} result(s) for '{query}'.")
                  return root
              except Exception as e:
                  print(f"{engine} news search failed for '{query}': {e}")
                  return None

          def google_news_official_fallback(county, index_url):
              # Used when an official county index is blocked (or produces no
              # qualifying stories). Search engines can still discover the public
              # article pages, and individual article pages are fetched directly
              # where possible so their own publication date wins over RSS time.
              domain = urllib.parse.urlparse(index_url).netloc.lower().removeprefix("www.")

              queries = [
                  f'site:{domain}/cricket/news/ cricket',
                  f'site:{domain} "{county}" cricket',
                  f'site:{domain} "{county}"',
                  f'site:{domain} "County Championship"',
                  f'site:{domain} 2026 cricket',
              ]

              stories = []
              seen_links = set()

              # Google News RSS is the reliable source here. Bing News RSS has been returning
              # malformed XML from the runner, so do not let it create noisy parser errors.
              for engine in ("google",):
                  for query in queries:
                      root = search_news_rss(engine, query)
                      if root is None:
                          continue

                      for item in root.findall(".//item")[:10]:
                          title = clean(item.findtext("title", ""))
                          link = clean(item.findtext("link", ""))
                          description = clean(BeautifulSoup(
                              item.findtext("description", ""), "html.parser"
                          ).get_text(" ", strip=True))
                          rss_published = parse_date(item.findtext("pubDate", ""))

                          if not title or not link or not rss_published:
                              continue
                          if rss_published < cutoff - timedelta(days=1) or rss_published > now + timedelta(minutes=30):
                              continue

                          source = item.find("source")
                          source_url = clean(
                              source.get("url", "") if source is not None else ""
                          ).lower()

                          resolved = resolve_search_result(link, domain)

                          # Google News sometimes supplies the official domain in
                          # <source> even when its redirect cannot be resolved.
                          if not resolved and domain not in source_url:
                              continue

                          official_link = resolved or link

                          if official_link in seen_links or official_link in seen:
                              continue

                          text = f"{title} {description}".lower()
                          # The search itself is restricted to the official county
                          # domain, so the county name does not need to appear in the headline.
                          # This prevents false negatives on short official headlines.

                          if any(term in text for term in EXCLUDE_TERMS):
                              continue

                          score = sum(1 for term in IMPORTANT_TERMS if term in text)
                          if score == 0:
                              continue

                          published = rss_published
                          article_title = title
                          article_description = description

                          # When the direct article is reachable, use its actual
                          # metadata instead of the search engine's timestamp.
                          if resolved:
                              try:
                                  article_html = fetch(resolved, timeout=10)
                                  real_title, real_description, real_published = article_metadata(
                                      resolved, article_html
                                  )
                                  if real_title:
                                      article_title = real_title
                                  if real_description:
                                      article_description = real_description
                                  if real_published:
                                      published = real_published
                              except Exception as e:
                                  print(f"{county}: fallback article metadata failed for {resolved}: {e}")

                          if published < cutoff or published > now + timedelta(minutes=30):
                              continue

                          final_text = f"{article_title} {article_description}".lower()
                          if any(term in final_text for term in EXCLUDE_TERMS):
                              continue

                          final_score = sum(
                              1 for term in IMPORTANT_TERMS if term in final_text
                          )
                          if final_score == 0:
                              continue

                          seen_links.add(official_link)
                          stories.append({
                              "county": county,
                              "title": article_title,
                              "description": article_description,
                              "link": official_link,
                              "published": published,
                              "score": final_score,
                              "source": "Official site via news search discovery"
                          })

              unique = {}
              for story in stories:
                  unique[story["link"]] = story

              result = sorted(
                  unique.values(),
                  key=lambda x: (x["score"], x["published"]),
                  reverse=True
              )[:3]

              print(f"{county}: official-site news-search fallback found {len(result)} candidate stories.")
              return result

          index_date_by_url = {}

          def candidate_links(index_url, pattern, county_context=None):
              html = fetch(index_url).decode("utf-8", errors="replace")
              soup = BeautifulSoup(html, "html.parser")
              base = urllib.parse.urlparse(index_url)
              links = []

              # Prefer links inside the page's main content. This avoids pulling
              # large numbers of navigation/footer links into the article parser.
              content_root = soup.find("main") or soup.find("article") or soup
              anchors = content_root.find_all("a", href=True)

              # If the site's main container is unusually sparse, fall back to
              # the full page so we do not miss article links.
              if len(anchors) < 3:
                  anchors = soup.find_all("a", href=True)

              generic_blocked_prefixes = (
                  "/about", "/contact", "/privacy", "/terms", "/cookies",
                  "/membership", "/newsletter", "/fixtures", "/results",
                  "/league-tables", "/tables", "/tickets", "/hospitality",
                  "/events/", "/events", "/shop", "/vacancies", "/jobs",
                  "/sponsorship", "/partners", "/foundation", "/community",
                  "/academy", "/pathway", "/junior", "/women",
                  "/videos", "/video", "/gallery", "/podcast", "/food-drink",
                  "/venue", "/corporate", "/history", "/club", "/teams",
                  "/team", "/matches", "/match-centre", "/match-day-guide"
              )

              for a in anchors:
                  href = urllib.parse.urljoin(index_url, a["href"])
                  parsed = urllib.parse.urlparse(href)

                  if parsed.netloc and parsed.netloc != base.netloc:
                      continue
                  if not re.search(pattern, parsed.path, re.I):
                      continue
                  if parsed.path.lower().endswith((".jpg", ".jpeg", ".png", ".gif", ".pdf", ".mp4")):
                      continue
                  if parsed.netloc == base.netloc and parsed.path.rstrip("/") == base.path.rstrip("/"):
                      continue

                  canonical = href.split("#", 1)[0].rstrip("/")
                  path_lower = parsed.path.lower()

                  if county_context in ("Lancashire", "Middlesex", "Warwickshire"):
                      # Some article pages do not expose a usable publication date
                      # in their HTML, but the news index places each article alongside
                      # a publication date. Capture that date while we still have the
                      # index page in hand.
                      node = a
                      for _ in range(5):
                          if not node:
                              break
                          context_text = clean(node.parent.get_text(" ", strip=True)) if node.parent else ""
                          date_match = re.search(
                              r"\b(\d{1,2})\s+(Jan(?:uary)?|Feb(?:ruary)?|Mar(?:ch)?|Apr(?:il)?|May|Jun(?:e)?|Jul(?:y)?|Aug(?:ust)?|Sep(?:tember)?|Oct(?:ober)?|Nov(?:ember)?|Dec(?:ember)?)\s+(20\d{2})\b",
                              context_text,
                              re.I
                          )
                          if date_match:
                              parsed_index_date = parse_date(
                                  f"{date_match.group(1)} {date_match.group(2)} {date_match.group(3)}"
                              )
                              if parsed_index_date:
                                  index_date_by_url[canonical] = parsed_index_date
                                  break

                          relative_match = re.search(
                              r"\b(?:about\s+)?(\d+)\s*(hour|hours|day|days)\s+ago\b",
                              context_text,
                              re.I
                          )
                          if relative_match:
                              amount = int(relative_match.group(1))
                              unit = relative_match.group(2).lower()
                              delta = timedelta(hours=amount) if unit.startswith("hour") else timedelta(days=amount)
                              index_date_by_url[canonical] = now - delta
                              break

                          node = node.parent

                  # Generic site-navigation exclusions that should never be
                  # mistaken for a county news article.
                  if any(path_lower.startswith(prefix) for prefix in generic_blocked_prefixes):
                      continue

                  # Common category/section URLs that match otherwise broad
                  # county-news patterns.
                  if path_lower.startswith("/news/category/"):
                      continue
                  if re.match(r"^/(?:category|author|tag|page)(?:/|$)", path_lower):
                      continue
                  if re.search(r"/page/\d+/?$", path_lower):
                      continue
                  if county_context == "Durham":
                      blocked_paths = (
                          "/news-and-media/durhamcricket",
                          "/news-and-media/cwc-19",
                          "/news-and-media/partners",
                          "/news-and-media/recreational-cricket",
                          "/news-and-media/womens-cricket"
                      )
                      if any(path_lower == path for path in blocked_paths):
                          continue

                  # Some news indexes link to their own root without a trailing
                  # slash, which can evade a simple full-URL comparison.
                  if county_context == "Somerset" and path_lower == "/news":
                      continue

                  if county_context in ("Warwickshire", "Surrey"):
                      blocked_prefixes = (
                          "/latest-news", "/membership", "/newsletter", "/fixtures", "/results",
                          "/league-tables", "/match-day-guide", "/beckenham-match-day-guide",
                          "/guildford-match-day-guide", "/tickets", "/hospitality", "/events/",
                          "/landing", "/videos", "/home", "/contact", "/privacy", "/terms",
                          "/food-drink", "/our-squad", "/sustainability", "/foundation",
                          "/shop", "/teams", "/club", "/matches", "/statistics", "/our-sponsors",
                          "/premium-seats", "/visiting-us", "/for-everyone", "/accessibility",
                          "/vip-experiences", "/cricket-centre", "/cookie-policy"
                      )
                      if any(path_lower.startswith(prefix) for prefix in blocked_prefixes):
                          continue

                  # Utilita Bowl's cricket/news index may expose non-news venue
                  # pages alongside genuine Hampshire cricket stories. The URL pattern
                  # above already limits candidates to /cricket/news/<slug>/.
                  if county_context == "Hampshire":
                      blocked = (
                          "/cricket/news/venue",
                          "/cricket/news/cricket",
                          "/cricket/news/hampshire-wellbeing-centre",
                          "/cricket/news/wedding-and-events",
                          "/cricket/news/christmas-and-new-year",
                          "/cricket/news/meetings-and-conferences",
                          "/cricket/news/foundation",
                          "/cricket/news/cricket-board",
                          "/cricket/news/ageas-bowl-live",
                          "/cricket/news/privacy",
                          "/cricket/news/golf",
                          "/cricket/news/hotel",
                          "/cricket/news/eforea",
                          "/cricket/news/beefys",
                          "/cricket/news/wellbeing",
                          "/cricket/news/conference",
                          "/cricket/news/events"
                      )
                      if any(path_lower.startswith(path) for path in blocked):
                          continue

                  if canonical not in links:
                      links.append(canonical)

              # Some sites put article URLs in data attributes, JSON, or
              # script-generated markup rather than normal <a href> links.
              # Fall back to extracting matching URLs directly from the raw
              # HTML when normal anchor discovery returns nothing.
              if not links:
                  candidates = set()
                  absolute_pattern = re.compile(
                      r"https?://[^\s\"'<>]+",
                      re.I
                  )
                  relative_pattern = re.compile(
                      r"(?<![A-Za-z0-9])(/\d{4}/\d{2}/[^\s\"'<>]+)",
                      re.I
                  )

                  for raw_url in absolute_pattern.findall(html):
                      clean_url = raw_url.rstrip('\\\\\\\'.,);]}')
                      parsed = urllib.parse.urlparse(clean_url)
                      if parsed.netloc != base.netloc:
                          continue
                      if not re.search(pattern, parsed.path, re.I):
                          continue
                      if any(parsed.path.lower().startswith(prefix) for prefix in generic_blocked_prefixes):
                          continue
                      candidates.add(clean_url.split("#", 1)[0].rstrip("/"))

                  for raw_path in relative_pattern.findall(html):
                      raw_path = raw_path.rstrip('\\\\\\\'.,);]}')
                      parsed = urllib.parse.urlparse(raw_path)
                      if not re.search(pattern, parsed.path, re.I):
                          continue
                      if any(parsed.path.lower().startswith(prefix) for prefix in generic_blocked_prefixes):
                          continue
                      candidates.add(
                          urllib.parse.urljoin(index_url, raw_path).split("#", 1)[0].rstrip("/")
                      )

                  links.extend(sorted(candidates))

              return links

          webhooks = {
              "SOMERSET_WEBHOOK_URL": os.environ.get("SOMERSET_WEBHOOK_URL", "").strip(),
              "DERBYSHIRE_WEBHOOK_URL": os.environ.get("DERBYSHIRE_WEBHOOK_URL", "").strip(),
              "DURHAM_WEBHOOK_URL": os.environ.get("DURHAM_WEBHOOK_URL", "").strip(),
              "ESSEX_WEBHOOK_URL": os.environ.get("ESSEX_WEBHOOK_URL", "").strip(),
              "GLAMORGAN_WEBHOOK_URL": os.environ.get("GLAMORGAN_WEBHOOK_URL", "").strip(),
              "GLOUCESTERSHIRE_WEBHOOK_URL": os.environ.get("GLOUCESTERSHIRE_WEBHOOK_URL", "").strip(),
              "HAMPSHIRE_WEBHOOK_URL": os.environ.get("HAMPSHIRE_WEBHOOK_URL", "").strip(),
              "KENT_WEBHOOK_URL": os.environ.get("KENT_WEBHOOK_URL", "").strip(),
              "LANCASHIRE_WEBHOOK_URL": os.environ.get("LANCASHIRE_WEBHOOK_URL", "").strip(),
              "NOTTINGHAMSHIRE_WEBHOOK_URL": os.environ.get("NOTTINGHAMSHIRE_WEBHOOK_URL", "").strip(),
              "SURREY_WEBHOOK_URL": os.environ.get("SURREY_WEBHOOK_URL", "").strip(),
              "LEICESTERSHIRE_WEBHOOK_URL": os.environ.get("LEICESTERSHIRE_WEBHOOK_URL", "").strip(),
              "MIDDLESEX_WEBHOOK_URL": os.environ.get("MIDDLESEX_WEBHOOK_URL", "").strip(),
              "NORTHAMPTONSHIRE_WEBHOOK_URL": os.environ.get("NORTHAMPTONSHIRE_WEBHOOK_URL", "").strip(),
              "SUSSEX_WEBHOOK_URL": os.environ.get("SUSSEX_WEBHOOK_URL", "").strip(),
              "YORKSHIRE_WEBHOOK_URL": os.environ.get("YORKSHIRE_WEBHOOK_URL", "").strip(),
              "WORCESTERSHIRE_WEBHOOK_URL": os.environ.get("WORCESTERSHIRE_WEBHOOK_URL", "").strip(),
              "WARWICKSHIRE_WEBHOOK_URL": os.environ.get("WARWICKSHIRE_WEBHOOK_URL", "").strip()
          }

          missing = [key for key in webhooks if not webhooks[key]]
          if missing:
              print("Webhook secret(s) not configured yet; those counties will be skipped: " + ", ".join(missing))

          now = datetime.now(timezone.utc)
          manual_run = os.environ.get("GITHUB_EVENT_NAME") == "workflow_dispatch"
          county_diag = {}

          # Manual and scheduled runs use the same lookback window so testing
          # behaves exactly like the daily collector.
          lookback_hours = 26
          cutoff = now - timedelta(hours=lookback_hours)
          print(f"Looking back {lookback_hours} hours.")
          found = []
          checked_links = set()

          for county, index_url, pattern, webhook_key in COUNTIES:
              county_diag[county] = {
                  "candidate_links": 0,
                  "already_seen": 0,
                  "article_checked": 0,
                  "fetch_failures": 0,
                  "metadata_failures": 0,
                  "outside_window": 0,
                  "filtered": 0,
                  "not_important": 0,
                  "index_failed": False,
                  "fallback_candidates": 0
              }

              if not webhooks.get(webhook_key):
                  print(f"{county}: skipped - {webhook_key} is not configured yet.")
                  continue

              try:
                  links = candidate_links(index_url, pattern, county)
              except urllib.error.HTTPError as e:
                  county_diag[county]["index_failed"] = True
                  print(f"{county}: index failed with HTTP {e.code}; trying official-site Google News fallback.")
                  fallback_stories = google_news_official_fallback(county, index_url)
                  county_diag[county]["fallback_candidates"] = len(fallback_stories)
                  for fallback_story in fallback_stories:
                      link = fallback_story["link"]
                      if link in seen:
                          county_diag[county]["already_seen"] += 1
                          continue
                      checked_links.add(link)
                      found.append({
                          "county": county,
                          "webhook_key": webhook_key,
                          "title": fallback_story["title"],
                          "description": fallback_story["description"],
                          "link": link,
                          "published": fallback_story["published"].isoformat(),
                          "score": fallback_story["score"]
                      })
                  continue
              except Exception as e:
                  county_diag[county]["index_failed"] = True
                  print(f"{county}: index failed: {e}")
                  continue

              print(f"{county}: found {len(links)} candidate URLs after navigation/category filtering.")
              county_diag[county]["candidate_links"] = len(links)
              county_found_before = len(found)

              for link in links:
                  if link in seen:
                      county_diag[county]["already_seen"] += 1
                      continue

                  try:
                      html = fetch(link)
                      county_diag[county]["article_checked"] += 1
                      title, description, published = article_metadata(link, html)
                  except Exception as e:
                      county_diag[county]["fetch_failures"] += 1
                      print(f"{county}: article failed {link}: {e}")
                      continue

                  if not published and county in ("Lancashire", "Middlesex", "Warwickshire"):
                      published = index_date_by_url.get(link)

                  if not published and county == "Middlesex":
                      # Middlesex article pages commonly show dates as
                      # "Thu 24 September" without the year. The URL carries the
                      # authoritative article year/month.
                      path_parts = urllib.parse.urlparse(link).path.split("/")
                      try:
                          url_year = int(path_parts[2])
                          url_month = int(path_parts[3])
                      except Exception:
                          url_year = None
                          url_month = None

                      if url_year and url_month:
                          page_text = clean((BeautifulSoup(html, "html.parser").find("main") or BeautifulSoup(html, "html.parser")).get_text(" ", strip=True))
                          month_name = datetime(url_year, url_month, 1).strftime("%B")
                          month_abbr = datetime(url_year, url_month, 1).strftime("%b")
                          day_match = re.search(
                              rf"\b(?:Mon|Tue|Wed|Thu|Fri|Sat|Sun)(?:day)?\s+(\d{{1,2}})\s+({month_name}|{month_abbr})\b",
                              page_text,
                              re.I
                          )
                          if day_match:
                              try:
                                  published = datetime(
                                      url_year,
                                      url_month,
                                      int(day_match.group(1)),
                                      tzinfo=timezone.utc
                                  )
                              except Exception:
                                  pass

                  if not published:
                      # A reachable article with an unparseable publication date is
                      # not necessarily invalid; use a conservative fallback based
                      # on the URL for date-based county sites.
                      url_date_match = re.search(r"/(2026)[-/](09|10)[-/](\d{1,2})", urllib.parse.urlparse(link).path)
                      if not url_date_match:
                          url_date_match = re.search(r"/(2026)[-/](09|10)[^/]*[-/](\d{1,2})(?:[-/]|$)", urllib.parse.urlparse(link).path)
                      if url_date_match and not published:
                          try:
                              year, month, day = [int(x) for x in url_date_match.groups()]
                              published = datetime(year, month, day, tzinfo=timezone.utc)
                          except Exception:
                              published = None

                  if county == "Warwickshire" and not published:
                      html_text = html.decode("utf-8", errors="replace") if isinstance(html, bytes) else str(html)
                      raw_date = re.search(
                          r'"datePublished"\s*:\s*"([^"]+)"',
                          html_text,
                          re.I
                      )
                      if raw_date:
                          published = parse_date(raw_date.group(1))

                  if not title or not published:
                      county_diag[county]["metadata_failures"] += 1
                      print(f"{county}: skipped {link} - title/date missing (title={bool(title)}, published={published})")
                      continue
                  if published < cutoff or published > now + timedelta(minutes=10):
                      county_diag[county]["outside_window"] += 1
                      print(f"{county}: skipped {link} - published {published.isoformat()} outside lookback")
                      continue

                  checked_links.add(link)
                  text = f"{title} {description}".lower()
                  if any(term in text for term in EXCLUDE_TERMS):
                      county_diag[county]["filtered"] += 1
                      print(f"{county}: filtered {title}")
                      continue

                  score = sum(1 for term in IMPORTANT_TERMS if term in text)
                  if score == 0:
                      county_diag[county]["not_important"] += 1
                      print(f"{county}: skipped {title} - no important terms")
                      continue

                  print(f"{county}: qualifying story - {title}")
                  found.append({
                      "county": county,
                      "webhook_key": webhook_key,
                      "title": title,
                      "description": description,
                      "link": link,
                      "published": published.isoformat(),
                      "score": score
                  })

              if len(found) == county_found_before:
                  for fallback_story in google_news_official_fallback(county, index_url):
                      link = fallback_story["link"]
                      if link in seen:
                          county_diag[county]["already_seen"] += 1
                          continue
                      checked_links.add(link)
                      found.append({
                          "county": county,
                          "webhook_key": webhook_key,
                          "title": fallback_story["title"],
                          "description": fallback_story["description"],
                          "link": link,
                          "published": fallback_story["published"].isoformat(),
                          "score": fallback_story["score"]
                      })

          # Deduplicate and keep the strongest items first.
          unique = {}
          for item in found:
              unique[item["link"]] = item

          found = sorted(
              unique.values(),
              key=lambda x: (x["score"], x["published"]),
              reverse=True
          )

          # Do not write seen-state yet. A story should only become
          # "seen" after Discord has accepted the message successfully.

          per_county = {}
          for item in found:
              per_county.setdefault(item["webhook_key"], []).append(item)
          found = [
              item
              for webhook_key in per_county
              for item in per_county[webhook_key][:3]
          ]

          def manual_diagnostic(county):
              info = county_diag.get(county, {})
              if info.get("index_failed"):
                  if info.get("fallback_candidates"):
                      return (
                          f"🔎 **Manual diagnostic**\n"
                          f"{info['fallback_candidates']} fallback article(s) were found. "
                          f"{info.get('already_seen', 0)} were already seen; no new qualifying story was posted."
                      )
                  return (
                      "🔎 **Manual diagnostic**\n"
                      "The county news source could not be checked successfully, "
                      "so this is not being treated as confirmation that there are no new stories."
                  )

              candidates = info.get("candidate_links", 0)
              already_seen = info.get("already_seen", 0)
              article_checked = info.get("article_checked", 0)
              fetch_failures = info.get("fetch_failures", 0)
              metadata_failures = info.get("metadata_failures", 0)
              outside_window = info.get("outside_window", 0)
              filtered = info.get("filtered", 0)
              not_important = info.get("not_important", 0)

              if candidates == 0:
                  return (
                      "🔎 **Manual diagnostic**\n"
                      "The news page returned no candidate article URLs after filtering."
                  )

              detail = [
                  f"{candidates} candidate URL(s) found",
                  f"{already_seen} already seen",
                  f"{article_checked} article page(s) fetched"
              ]
              if fetch_failures:
                  detail.append(f"{fetch_failures} fetch failed")
              if metadata_failures:
                  detail.append(f"{metadata_failures} missing/unparseable date or title")
              if outside_window:
                  detail.append(f"{outside_window} outside the 26-hour window")
              if filtered:
                  detail.append(f"{filtered} filtered out")
              if not_important:
                  detail.append(f"{not_important} lacked important terms")

              diagnostic = (
                  " · ".join(detail)
                  + ". No new qualifying stories were found in the last 26 hours."
              )
              print(f"{county}: DIAGNOSTIC - {diagnostic}")
              return "🔎 **Manual diagnostic**\\n" + diagnostic

          def send_manual_no_story_messages():
              counties_with_stories = {item["webhook_key"] for item in found}
              for county, _, _, webhook_key in COUNTIES:
                  if not webhooks.get(webhook_key):
                      continue
                  if webhook_key in counties_with_stories:
                      continue
                  if manual_run:
                      message = (
                          f"🏏 **{county} County Watch - {now.strftime('%d %B %Y')}**\n"
                          f"*{manual_diagnostic(county)}*"
                      )
                      request = urllib.request.Request(
                          webhooks[webhook_key],
                          data=json.dumps({"content": message, "flags": 4}).encode("utf-8"),
                          headers={
                              "Content-Type": "application/json",
                              "User-Agent": "Mozilla/5.0 (County Championship Discord Bot)"
                          },
                          method="POST"
                      )
                      try:
                          with urllib.request.urlopen(request, timeout=15) as response:
                              print(f"{county} manual diagnostic response: {response.status}")
                      except Exception as e:
                          print(f"{county} manual diagnostic failed: {e}")

          if not found:
              # No Discord delivery is needed, so it is safe to persist the
              # links we checked and filtered out.
              for link in checked_links:
                  seen.setdefault(link, now.isoformat())

              if len(seen) > 1000:
                  recent = sorted(seen.items(), key=lambda x: x[1], reverse=True)[:800]
                  seen = dict(recent)

              with open(STATE_PATH, "w", encoding="utf-8") as f:
                  json.dump(seen, f, indent=2)

              if manual_run:
                  send_manual_no_story_messages()

              print("No new qualifying county stories found.")
              raise SystemExit(0)

          def story_emoji(item):
              text = (item["title"] + " " + item["description"]).lower()

              if re.search(r"\bchampions?|title|promot(?:ed|ion)|relegat(?:ed|ion)\b", text):
                  return "🏆"
              if re.search(r"\bhat[- ]trick|five[- ]for|wicket haul\b", text):
                  return "🎯"
              if re.search(r"\b\d{3}\b|\bcentur(?:y|ies)\b|double hundred", text):
                  return "💯"
              if re.search(r"\bone[- ]wicket|thriller|dramatic|last[- ]wicket|final[- ]day\b", text):
                  return "🔥"
              if re.search(r"\bwin(?:s|ning)?|victory|defeat|beaten\b", text):
                  return "🏏"
              return "📰"

          # Deliver one bulletin per county, to that county's webhook.
          delivered_links = set()
          delivery_errors = []

          for county, _, _, webhook_key in COUNTIES:
              county_items = [item for item in found if item["webhook_key"] == webhook_key]
              if not county_items:
                  continue

              lines = [
                  f"🏏 **{county} County Watch - {now.strftime('%d %B %Y')}**",
                  f"*Here are the latest stories from {county} County Cricket Club.*",
                  ""
              ]

              for item in county_items:
                  summary = item["description"]
                  if len(summary) > 260:
                      summary = summary[:257].rsplit(" ", 1)[0] + "..."
                  emoji = story_emoji(item)

                  if summary:
                      lines.append(f"{emoji} **{item['title']}** {summary}")
                  else:
                      lines.append(f"{emoji} **{item['title']}**")

                  source_label = item.get("source", "Official county site")
                  lines.append(
                      f"*{source_label} ·* **[Read the full story →]({item['link']})**"
                  )
                  lines.append("")

              message = "\n".join(lines)
              if len(message) > 1900:
                  message = message[:1897].rsplit("\n", 1)[0] + "..."

              print(message)

              webhook = webhooks[webhook_key]
              request = urllib.request.Request(
                  webhook,
                  data=json.dumps({"content": message, "flags": 4}).encode("utf-8"),
                  headers={
                      "Content-Type": "application/json",
                      "User-Agent": "Mozilla/5.0 (County Championship Discord Bot)"
                  },
                  method="POST"
              )
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      print(f"{county} Discord response: {response.status}")
                      delivered_links.update(item["link"] for item in county_items)
              except urllib.error.HTTPError as e:
                  body = e.read().decode("utf-8", errors="replace")
                  error = f"{county} Discord webhook HTTP {e.code}: {body}"
                  print(error)
                  delivery_errors.append(error)
              except Exception as e:
                  error = f"{county} Discord webhook failed: {e}"
                  print(error)
                  delivery_errors.append(error)

          if manual_run:
              send_manual_no_story_messages()

          # Only mark stories as seen after their county's Discord delivery succeeds.
          for link in delivered_links:
              seen.setdefault(link, now.isoformat())

          if len(seen) > 1000:
              recent = sorted(seen.items(), key=lambda x: x[1], reverse=True)[:800]
              seen = dict(recent)

          with open(STATE_PATH, "w", encoding="utf-8") as f:
              json.dump(seen, f, indent=2)

          if delivery_errors:
              raise SystemExit("One or more county Discord deliveries failed.")
          PY

      - name: Save seen-state
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # Persist the watcher memory through the GitHub Contents API.
          if [ ! -f data/county-watch-seen.json ]; then
            echo "No county watcher state file was created."
            exit 0
          fi

          python3 - <<'PY'
          import base64
          import json
          import os
          import urllib.parse
          import urllib.request
          import urllib.error

          repo = os.environ["REPO"]
          token = os.environ["GH_TOKEN"]
          path = "data/county-watch-seen.json"
          api = f"https://api.github.com/repos/{repo}/contents/{urllib.parse.quote(path, safe='/')}"

          with open(path, "rb") as f:
              content_b64 = base64.b64encode(f.read()).decode("ascii")

          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "County Championship Bot"
          }

          current_sha = None
          try:
              req = urllib.request.Request(api, headers=headers, method="GET")
              with urllib.request.urlopen(req, timeout=10) as response:
                  current_sha = json.load(response).get("sha")
          except urllib.error.HTTPError as e:
              if e.code != 404:
                  raise

          payload = {
              "message": "Update county website watch state",
              "content": content_b64
          }
          if current_sha:
              payload["sha"] = current_sha

          req = urllib.request.Request(
              api,
              data=json.dumps(payload).encode("utf-8"),
              headers={**headers, "Content-Type": "application/json"},
              method="PUT"
          )

          try:
              with urllib.request.urlopen(req, timeout=15) as response:
                  print(f"State saved: HTTP {response.status}")
          except urllib.error.HTTPError as e:
              body = e.read().decode("utf-8", errors="replace")
              print(f"State save failed: HTTP {e.code}: {body}")
              raise
          PY