name: County Website Watch

on:
  workflow_dispatch:
  schedule:
    # Run at 09:00 Europe/London year-round; GitHub handles BST/GMT.
    - cron: "0 9 * * *"
      timezone: "Europe/London"

permissions:
  contents: write

concurrency:
  group: county-website-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Install parser
        run: python -m pip install --disable-pip-version-check beautifulsoup4

      - name: Collect new county news
        env:
          SOMERSET_WEBHOOK_URL: ${{ secrets.SOMERSET_WEBHOOK_URL }}
          DERBYSHIRE_WEBHOOK_URL: ${{ secrets.DERBYSHIRE_WEBHOOK_URL }}
          DURHAM_WEBHOOK_URL: ${{ secrets.DURHAM_WEBHOOK_URL }}
          ESSEX_WEBHOOK_URL: ${{ secrets.ESSEX_WEBHOOK_URL }}
          GLAMORGAN_WEBHOOK_URL: ${{ secrets.GLAMORGAN_WEBHOOK_URL }}
          GLOUCESTERSHIRE_WEBHOOK_URL: ${{ secrets.GLOUCESTERSHIRE_WEBHOOK_URL }}
          LEICESTERSHIRE_WEBHOOK_URL: ${{ secrets.LEICESTERSHIRE_WEBHOOK_URL }}
          MIDDLESEX_WEBHOOK_URL: ${{ secrets.MIDDLESEX_WEBHOOK_URL }}
          NORTHAMPTONSHIRE_WEBHOOK_URL: ${{ secrets.NORTHAMPTONSHIRE_WEBHOOK_URL }}
          SUSSEX_WEBHOOK_URL: ${{ secrets.SUSSEX_WEBHOOK_URL }}
          YORKSHIRE_WEBHOOK_URL: ${{ secrets.YORKSHIRE_WEBHOOK_URL }}
          WORCESTERSHIRE_WEBHOOK_URL: ${{ secrets.WORCESTERSHIRE_WEBHOOK_URL }}
          WARWICKSHIRE_WEBHOOK_URL: ${{ secrets.WARWICKSHIRE_WEBHOOK_URL }}
          HAMPSHIRE_WEBHOOK_URL: ${{ secrets.HAMPSHIRE_WEBHOOK_URL }}
          KENT_WEBHOOK_URL: ${{ secrets.KENT_WEBHOOK_URL }}
          LANCASHIRE_WEBHOOK_URL: ${{ secrets.LANCASHIRE_WEBHOOK_URL }}
          NOTTINGHAMSHIRE_WEBHOOK_URL: ${{ secrets.NOTTINGHAMSHIRE_WEBHOOK_URL }}
          SURREY_WEBHOOK_URL: ${{ secrets.SURREY_WEBHOOK_URL }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          import urllib.parse
          import urllib.request
          import urllib.error
          import xml.etree.ElementTree as ET
          from datetime import datetime, timezone, timedelta
          from email.utils import parsedate_to_datetime

          from bs4 import BeautifulSoup

          COUNTIES = [
              # Launching with Somerset first.
              ("Somerset", "https://somersetcountycc.co.uk/news/", r"/news/", "SOMERSET_WEBHOOK_URL"),
              ("Derbyshire", "https://derbyshireccc.com/news/", r"/\d{4}/\d{2}/", "DERBYSHIRE_WEBHOOK_URL"),
              ("Durham", "https://www.durhamcricket.co.uk/news-and-media/", r"/news-and-media/(?!news/?$|match-reports/?$|match-previews/?$|international/?$|video/?$|t20-blast/?$|interviews/?$|features/?$|foundation/?$|events/?$|partners-news/?$|recreational/?$|women/?$|representative/?$)[^/]+/?$", "DURHAM_WEBHOOK_URL"),
              ("Essex", "https://essexcricket.org.uk/news/", r"/\d{4}/\d{2}/\d{2}/[^/]+/?$", "ESSEX_WEBHOOK_URL"),
              ("Gloucestershire", "https://www.gloscricket.co.uk/news/", r"/news/.+", "GLOUCESTERSHIRE_WEBHOOK_URL"),
              ("Leicestershire", "https://leicestershireccc.co.uk/news", r"/news/.+", "LEICESTERSHIRE_WEBHOOK_URL"),
              ("Middlesex", "https://www.middlesexccc.com/news", r"/news/.+", "MIDDLESEX_WEBHOOK_URL"),
              ("Northamptonshire", "https://nccc.co.uk/", r"/news/.+", "NORTHAMPTONSHIRE_WEBHOOK_URL"),
              ("Sussex", "https://sussexcricket.co.uk/", r"/news/.+", "SUSSEX_WEBHOOK_URL"),
              ("Yorkshire", "https://yorkshireccc.com/news/", r"/news/.+", "YORKSHIRE_WEBHOOK_URL"),
              ("Worcestershire", "https://wccc.co.uk/news/", r"/news/.+", "WORCESTERSHIRE_WEBHOOK_URL"),
              ("Warwickshire", "https://www.edgbaston.com/news", r"/[^/]+/?$", "WARWICKSHIRE_WEBHOOK_URL"),
              ("Hampshire", "https://www.ageasbowl.com/cricket/news/", r"/cricket/news/[^/]+/?$", "HAMPSHIRE_WEBHOOK_URL"),
              ("Kent", "https://www.kentcricket.co.uk/news/", r"/news/.+", "KENT_WEBHOOK_URL"),
              ("Lancashire", "https://cricket.lancashirecricket.co.uk/news/", r"/news/\d{4}-news/[^/]+/?$", "LANCASHIRE_WEBHOOK_URL"),
              ("Nottinghamshire", "https://www.trentbridge.co.uk/news/", r"/news/\d{4}/[^/]+/[^/]+\.html$", "NOTTINGHAMSHIRE_WEBHOOK_URL"),
              ("Surrey", "https://www.kiaoval.com/latest-news/", r"/[^/]+/?$", "SURREY_WEBHOOK_URL"),
              ("Glamorgan", "https://www.glamorgancricket.com/news/", r"/news/.+", "GLAMORGAN_WEBHOOK_URL")
          ]

          # The bot is intended for county men's cricket and significant club news.
          # Commercial, ticketing, hospitality, community and women's-only articles
          # are filtered unless the article is clearly about the men's first team.
          EXCLUDE_TERMS = [
              "women's cricket", "women’s cricket", "women's team", "women’s team",
              "women v", "women vs", "ladies", "foundation", "community",
              "hospitality", "membership", "ticket", "tickets", "christmas",
              "vacancy", "job opportunity", "commercial partner", "sponsorship"
          ]

          IMPORTANT_TERMS = [
              "county championship", "first team", "men's", "men’s", "sign",
              "signs", "contract", "extend", "extension", "leave", "leaves",
              "retire", "retirement", "injury", "squad", "match report",
              "match preview", "century", "five-for", "six-for", "wicket",
              "victory", "win", "defeat", "champions", "promotion", "relegation"
          ]

          STATE_PATH = "data/county-watch-seen.json"
          os.makedirs("data", exist_ok=True)

          try:
              with open(STATE_PATH, "r", encoding="utf-8") as f:
                  seen = json.load(f)
          except Exception:
              seen = {}

          def fetch(url, timeout=12):
              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "Mozilla/5.0 (County Championship Discord Bot)"
                  }
              )
              with urllib.request.urlopen(request, timeout=timeout) as response:
                  return response.read()

          def clean(text):
              return re.sub(r"\s+", " ", text or "").strip()

          def parse_date(value):
              if not value:
                  return None
              value = value.strip()
              try:
                  dt = datetime.fromisoformat(value.replace("Z", "+00:00"))
                  if dt.tzinfo is None:
                      dt = dt.replace(tzinfo=timezone.utc)
                  return dt.astimezone(timezone.utc)
              except Exception:
                  pass
              try:
                  dt = parsedate_to_datetime(value)
                  if dt.tzinfo is None:
                      dt = dt.replace(tzinfo=timezone.utc)
                  return dt.astimezone(timezone.utc)
              except Exception:
                  pass

              # Some county sites expose dates as human-readable text,
              # e.g. "24 September 26".
              value = re.sub(r"^(?:Mon(?:day)?|Tue(?:sday)?|Wed(?:nesday)?|Thu(?:rsday)?|Fri(?:day)?|Sat(?:urday)?|Sun(?:day)?)\s+", "", value, flags=re.I)
              value = re.sub(r"\b(\d{1,2})(st|nd|rd|th)\b", r"\1", value, flags=re.I)
              for fmt in ("%d %B %y", "%d %B %Y", "%d %b %y", "%d %b %Y", "%B %d, %Y", "%b %d, %Y"):
                  try:
                      dt = datetime.strptime(value, fmt).replace(tzinfo=timezone.utc)
                      return dt
                  except Exception:
                      continue

              return None

          def article_metadata(url, html):
              soup = BeautifulSoup(html, "html.parser")

              title = ""
              h1 = soup.find("h1")
              if h1:
                  title = clean(h1.get_text(" ", strip=True))

              if not title and soup.find("meta", property="og:title"):
                  title = clean(soup.find("meta", property="og:title").get("content", ""))

              if not title and soup.title:
                  title = clean(soup.title.get_text(" ", strip=True))

              description = ""
              meta = soup.find("meta", attrs={"name": "description"})
              if meta:
                  description = clean(meta.get("content", ""))

              published = None

              # Some sites expose the publication date in a <time datetime="..."> element.
              time_tag = soup.find("time", attrs={"datetime": True})
              if time_tag:
                  published = parse_date(time_tag.get("datetime", ""))

              # Prefer structured article metadata when the page provides it.
              for script in soup.find_all("script", type="application/ld+json"):
                  try:
                      data = json.loads(script.string or script.get_text())
                  except Exception:
                      continue

                  objects = data if isinstance(data, list) else [data]
                  for obj in objects:
                      if isinstance(obj, dict):
                          if not description and obj.get("description"):
                              description = clean(str(obj["description"]))
                          if obj.get("datePublished") and not published:
                              published = parse_date(str(obj["datePublished"]))

              # If there is still no description, use the opening paragraph(s)
              # from the article itself as the story summary.
              if not description:
                  article_root = soup.find("article") or soup.find("main") or soup
                  paragraphs = []
                  for p in article_root.find_all("p"):
                      text = clean(p.get_text(" ", strip=True))
                      if len(text) >= 40 and text.lower() != title.lower():
                          paragraphs.append(text)
                      if len(paragraphs) == 2:
                          break
                  description = " ".join(paragraphs)

              for meta_name in ["article:published_time", "datePublished", "pubdate"]:
                  tag = soup.find("meta", property=meta_name) or soup.find("meta", attrs={"name": meta_name})
                  if tag:
                      published = parse_date(tag.get("content", ""))
                      if published:
                          break

              # Many county sites expose datePublished in JSON-LD.
              for script in soup.find_all("script", type="application/ld+json"):
                  if published:
                      break
                  try:
                      data = json.loads(script.string or script.get_text())
                  except Exception:
                      continue

                  objects = data if isinstance(data, list) else [data]
                  for obj in objects:
                      if isinstance(obj, dict) and obj.get("datePublished"):
                          published = parse_date(str(obj["datePublished"]))
                          if published:
                              break

              # Final fallback for county sites that render the publication date
              # as visible text rather than metadata.
              if not published:
                  page_text = clean(soup.get_text(" ", strip=True))
                  date_match = re.search(
                      r"\b(?:Mon|Tue|Wed|Thu|Fri|Sat|Sun)(?:day)?\s+(\d{1,2})\s+"
                      r"(Jan(?:uary)?|Feb(?:ruary)?|Mar(?:ch)?|Apr(?:il)?|May|Jun(?:e)?|Jul(?:y)?|Aug(?:ust)?|Sep(?:tember)?|Oct(?:ober)?|Nov(?:ember)?|Dec(?:ember)?)"
                      r"\s+(\d{4})\b",
                      page_text,
                      re.I
                  )
                  if date_match:
                      date_text = f"{date_match.group(1)} {date_match.group(2)} {date_match.group(3)}"
                      for date_fmt in ("%d %B %Y", "%d %b %Y"):
                          try:
                              published = datetime.strptime(date_text, date_fmt).replace(tzinfo=timezone.utc)
                              break
                          except Exception:
                              continue

              if not published:
                  page_text = clean(soup.get_text(" ", strip=True))
                  month_first = re.search(
                      r"\b(January|February|March|April|May|June|July|August|September|October|November|December)\s+"
                      r"(\d{1,2})(?:st|nd|rd|th)?,\s+(\d{4})\b",
                      page_text,
                      re.I
                  )
                  if not month_first:
                      month_first = re.search(
                          r"\b(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\s+"
                          r"(\d{1,2})(?:st|nd|rd|th)?,\s+(\d{4})\b",
                          page_text,
                          re.I
                      )
                  if month_first:
                      date_text = f"{month_first.group(2)} {month_first.group(1)} {month_first.group(3)}"
                      for date_fmt in ("%d %B %Y", "%d %b %Y"):
                          try:
                              published = datetime.strptime(date_text, date_fmt).replace(tzinfo=timezone.utc)
                              break
                          except Exception:
                              continue

              if not published:
                  page_text = clean(soup.get_text(" ", strip=True))
                  day_first = re.search(
                      r"\b(\d{1,2})(?:st|nd|rd|th)?\s+"
                      r"(January|February|March|April|May|June|July|August|September|October|November|December|"
                      r"Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\s+(\d{4})\b",
                      page_text,
                      re.I
                  )
                  if day_first:
                      date_text = f"{day_first.group(1)} {day_first.group(2)} {day_first.group(3)}"
                      for date_fmt in ("%d %B %Y", "%d %b %Y"):
                          try:
                              published = datetime.strptime(date_text, date_fmt).replace(tzinfo=timezone.utc)
                              break
                          except Exception:
                              continue

              return title, description, published

          def espncricinfo_fallback(county):
              # Used only when the official county site returns HTTP 403.
              # Google News RSS is used as a discovery layer, restricted to
              # ESPNcricinfo results for this specific county.
              query = f'site:espncricinfo.com "{county}" cricket'
              rss_url = (
                  "https://news.google.com/rss/search?q="
                  + urllib.parse.quote(query)
                  + "&hl=en-GB&gl=GB&ceid=GB:en"
              )

              stories = []
              try:
                  xml = fetch(rss_url).decode("utf-8", errors="replace")
                  root = ET.fromstring(xml)
              except Exception as e:
                  print(f"{county}: ESPNcricinfo fallback failed: {e}")
                  return stories

              for item in root.findall(".//item")[:5]:
                  title = clean(item.findtext("title", ""))
                  link = clean(item.findtext("link", ""))
                  pub_date = parse_date(item.findtext("pubDate", ""))
                  description = clean(BeautifulSoup(
                      item.findtext("description", ""), "html.parser"
                  ).get_text(" ", strip=True))

                  source = item.find("source")
                  source_name = clean(source.text if source is not None else "")
                  if source_name.lower() != "espncricinfo":
                      continue

                  # Resolve the Google News redirect so Discord links go
                  # directly to ESPNcricinfo where possible.
                  if link:
                      try:
                          request = urllib.request.Request(
                              link,
                              headers={"User-Agent": "Mozilla/5.0 (County Championship Discord Bot)"}
                          )
                          with urllib.request.urlopen(request, timeout=10) as response:
                              resolved = response.geturl()
                              if "espncricinfo.com" in urllib.parse.urlparse(resolved).netloc:
                                  link = resolved.split("#", 1)[0]
                      except Exception:
                          pass

                  if not link or "espncricinfo.com" not in urllib.parse.urlparse(link).netloc:
                      continue

                  text = f"{title} {description}".lower()
                  county_term = county.lower()
                  if county_term not in text:
                      continue
                  if any(term in text for term in EXCLUDE_TERMS):
                      continue

                  if not pub_date:
                      continue
                  if pub_date < cutoff or pub_date > now + timedelta(minutes=10):
                      continue

                  score = sum(1 for term in IMPORTANT_TERMS if term in text)
                  if score == 0:
                      continue

                  stories.append({
                      "county": county,
                      "title": title,
                      "description": description,
                      "link": link,
                      "published": pub_date,
                      "score": score
                  })

              unique = {}
              for story in stories:
                  unique[story["link"]] = story

              result = sorted(
                  unique.values(),
                  key=lambda x: (x["score"], x["published"]),
                  reverse=True
              )[:8]

              print(f"{county}: ESPNcricinfo fallback found {len(result)} candidate stories.")
              return result

          def google_news_official_fallback(county, index_url):
              domain = urllib.parse.urlparse(index_url).netloc.lower().removeprefix("www.")
              query = f'site:{domain} "{county}" cricket'
              rss_url = (
                  "https://news.google.com/rss/search?q="
                  + urllib.parse.quote(query)
                  + "&hl=en-GB&gl=GB&ceid=GB:en"
              )

              stories = []
              try:
                  xml = fetch(rss_url, timeout=10).decode("utf-8", errors="replace")
                  root = ET.fromstring(xml)
              except Exception as e:
                  print(f"{county}: official-site Google News fallback failed: {e}")
                  return stories

              for item in root.findall(".//item")[:5]:
                  title = clean(item.findtext("title", ""))
                  link = clean(item.findtext("link", ""))
                  description = clean(BeautifulSoup(
                      item.findtext("description", ""), "html.parser"
                  ).get_text(" ", strip=True))
                  published = parse_date(item.findtext("pubDate", ""))
                  source = item.find("source")
                  source_url = clean(source.get("url", "") if source is not None else "").lower()

                  if not title or not link or not published:
                      continue
                  if published < cutoff or published > now + timedelta(minutes=10):
                      continue

                  resolved = link
                  try:
                      request = urllib.request.Request(
                          link,
                          headers={"User-Agent": "Mozilla/5.0 (County Championship Discord Bot)"}
                      )
                      with urllib.request.urlopen(request, timeout=5) as response:
                          resolved = response.geturl().split("#", 1)[0]
                  except Exception:
                      pass

                  resolved_host = urllib.parse.urlparse(resolved).netloc.lower().removeprefix("www.")
                  if not (
                      resolved_host == domain
                      or resolved_host.endswith("." + domain)
                      or domain in source_url
                  ):
                      continue

                  text = f"{title} {description}".lower()
                  if any(term in text for term in EXCLUDE_TERMS):
                      continue

                  score = sum(1 for term in IMPORTANT_TERMS if term in text)
                  if score == 0:
                      continue

                  stories.append({
                      "county": county,
                      "title": title,
                      "description": description,
                      "link": resolved,
                      "published": published,
                      "score": score,
                      "source": "Official site via Google News discovery"
                  })

              unique = {}
              for story in stories:
                  unique[story["link"]] = story
              result = sorted(
                  unique.values(),
                  key=lambda x: (x["score"], x["published"]),
                  reverse=True
              )[:3]
              print(f"{county}: official-site Google News fallback found {len(result)} candidate stories.")
              return result

          def candidate_links(index_url, pattern, county_context=None):
              html = fetch(index_url).decode("utf-8", errors="replace")
              soup = BeautifulSoup(html, "html.parser")
              base = urllib.parse.urlparse(index_url)
              links = []

              for a in soup.find_all("a", href=True):
                  href = urllib.parse.urljoin(index_url, a["href"])
                  parsed = urllib.parse.urlparse(href)

                  if parsed.netloc and parsed.netloc != base.netloc:
                      continue
                  if not re.search(pattern, parsed.path, re.I):
                      continue
                  if parsed.path.lower().endswith((".jpg", ".jpeg", ".png", ".gif", ".pdf", ".mp4")):
                      continue
                  if href.rstrip("/") == index_url.rstrip("/"):
                      continue

                  canonical = href.split("#", 1)[0].rstrip("/")

                  if county_context in ("Warwickshire", "Surrey"):
                      blocked_prefixes = (
                          "/latest-news", "/membership", "/newsletter", "/fixtures", "/results",
                          "/league-tables", "/match-day-guide", "/beckenham-match-day-guide",
                          "/guildford-match-day-guide", "/tickets", "/hospitality", "/events/",
                          "/landing", "/videos", "/home", "/contact", "/privacy", "/terms",
                          "/sustainability", "/foundation", "/shop", "/teams", "/club", "/matches"
                      )
                      if any(parsed.path.lower().startswith(prefix) for prefix in blocked_prefixes):
                          continue

                  # Ageas Bowl's cricket/news index contains several venue/service
                  # pages alongside actual cricket stories. Avoid fetching those.
                  if county_context == "Hampshire":
                      blocked = (
                          "/cricket/news/golf",
                          "/cricket/news/hotel",
                          "/cricket/news/eforea",
                          "/cricket/news/beefys",
                          "/cricket/news/wellbeing",
                          "/cricket/news/conference",
                          "/cricket/news/events"
                      )
                      if any(parsed.path.lower().startswith(path) for path in blocked):
                          continue

                  if canonical not in links:
                      links.append(canonical)

              # Some sites put article URLs in data attributes, JSON, or
              # script-generated markup rather than normal <a href> links.
              # Fall back to extracting matching URLs directly from the raw
              # HTML when normal anchor discovery returns nothing.
              if not links:
                  candidates = set()
                  absolute_pattern = re.compile(
                      r"https?://[^\s\"'<>]+",
                      re.I
                  )
                  relative_pattern = re.compile(
                      r"(?<![A-Za-z0-9])(/\d{4}/\d{2}/[^\s\"'<>]+)",
                      re.I
                  )

                  for raw_url in absolute_pattern.findall(html):
                      clean_url = raw_url.rstrip('\\\\\\\'.,);]}')
                      parsed = urllib.parse.urlparse(clean_url)
                      if parsed.netloc != base.netloc:
                          continue
                      if not re.search(pattern, parsed.path, re.I):
                          continue
                      candidates.add(clean_url.split("#", 1)[0].rstrip("/"))

                  for raw_path in relative_pattern.findall(html):
                      raw_path = raw_path.rstrip('\\\\\\\'.,);]}')
                      parsed = urllib.parse.urlparse(raw_path)
                      if not re.search(pattern, parsed.path, re.I):
                          continue
                      candidates.add(
                          urllib.parse.urljoin(index_url, raw_path).split("#", 1)[0].rstrip("/")
                      )

                  links.extend(sorted(candidates))

              return links[:8]

          webhooks = {
              "SOMERSET_WEBHOOK_URL": os.environ.get("SOMERSET_WEBHOOK_URL", "").strip(),
              "DERBYSHIRE_WEBHOOK_URL": os.environ.get("DERBYSHIRE_WEBHOOK_URL", "").strip(),
              "DURHAM_WEBHOOK_URL": os.environ.get("DURHAM_WEBHOOK_URL", "").strip(),
              "ESSEX_WEBHOOK_URL": os.environ.get("ESSEX_WEBHOOK_URL", "").strip(),
              "GLAMORGAN_WEBHOOK_URL": os.environ.get("GLAMORGAN_WEBHOOK_URL", "").strip(),
              "GLOUCESTERSHIRE_WEBHOOK_URL": os.environ.get("GLOUCESTERSHIRE_WEBHOOK_URL", "").strip(),
              "HAMPSHIRE_WEBHOOK_URL": os.environ.get("HAMPSHIRE_WEBHOOK_URL", "").strip(),
              "KENT_WEBHOOK_URL": os.environ.get("KENT_WEBHOOK_URL", "").strip(),
              "LANCASHIRE_WEBHOOK_URL": os.environ.get("LANCASHIRE_WEBHOOK_URL", "").strip(),
              "NOTTINGHAMSHIRE_WEBHOOK_URL": os.environ.get("NOTTINGHAMSHIRE_WEBHOOK_URL", "").strip(),
              "SURREY_WEBHOOK_URL": os.environ.get("SURREY_WEBHOOK_URL", "").strip(),
              "LEICESTERSHIRE_WEBHOOK_URL": os.environ.get("LEICESTERSHIRE_WEBHOOK_URL", "").strip(),
              "MIDDLESEX_WEBHOOK_URL": os.environ.get("MIDDLESEX_WEBHOOK_URL", "").strip(),
              "NORTHAMPTONSHIRE_WEBHOOK_URL": os.environ.get("NORTHAMPTONSHIRE_WEBHOOK_URL", "").strip(),
              "SUSSEX_WEBHOOK_URL": os.environ.get("SUSSEX_WEBHOOK_URL", "").strip(),
              "YORKSHIRE_WEBHOOK_URL": os.environ.get("YORKSHIRE_WEBHOOK_URL", "").strip(),
              "WORCESTERSHIRE_WEBHOOK_URL": os.environ.get("WORCESTERSHIRE_WEBHOOK_URL", "").strip(),
              "WARWICKSHIRE_WEBHOOK_URL": os.environ.get("WARWICKSHIRE_WEBHOOK_URL", "").strip()
          }

          missing = [key for key in webhooks if not webhooks[key]]
          if missing:
              print("Webhook secret(s) not configured yet; those counties will be skipped: " + ", ".join(missing))

          now = datetime.now(timezone.utc)

          # Manual and scheduled runs use the same lookback window so testing
          # behaves exactly like the daily collector.
          lookback_hours = 26
          cutoff = now - timedelta(hours=lookback_hours)
          print(f"Looking back {lookback_hours} hours.")
          found = []
          checked_links = set()

          for county, index_url, pattern, webhook_key in COUNTIES:
              if not webhooks.get(webhook_key):
                  print(f"{county}: skipped - {webhook_key} is not configured yet.")
                  continue

              try:
                  links = candidate_links(index_url, pattern, county)
              except urllib.error.HTTPError as e:
                  print(f"{county}: index failed with HTTP {e.code}; trying official-site Google News fallback.")
                  for fallback_story in google_news_official_fallback(county, index_url):
                      link = fallback_story["link"]
                      if link in seen:
                          continue
                      checked_links.add(link)
                      found.append({
                          "county": county,
                          "webhook_key": webhook_key,
                          "title": fallback_story["title"],
                          "description": fallback_story["description"],
                          "link": link,
                          "published": fallback_story["published"].isoformat(),
                          "score": fallback_story["score"]
                      })
                  continue
              except Exception as e:
                  print(f"{county}: index failed: {e}")
                  continue

              print(f"{county}: found {len(links)} candidate links.")
              county_found_before = len(found)

              for link in links:
                  # During manual testing, allow Essex to re-evaluate recent
                  # links that were seen before its date parsing was fixed.
                  if link in seen:
                      continue

                  try:
                      html = fetch(link)
                      title, description, published = article_metadata(link, html)
                  except Exception as e:
                      print(f"{county}: article failed {link}: {e}")
                      continue

                  if not title or not published:
                      print(f"{county}: skipped {link} - title/date missing (title={bool(title)}, published={published})")
                      continue
                  if published < cutoff or published > now + timedelta(minutes=10):
                      print(f"{county}: skipped {link} - published {published.isoformat()} outside lookback")
                      continue

                  checked_links.add(link)
                  text = f"{title} {description}".lower()
                  if any(term in text for term in EXCLUDE_TERMS):
                      print(f"{county}: filtered {title}")
                      continue

                  score = sum(1 for term in IMPORTANT_TERMS if term in text)
                  if score == 0:
                      print(f"{county}: skipped {title} - no important terms")
                      continue

                  print(f"{county}: qualifying story - {title}")
                  found.append({
                      "county": county,
                      "webhook_key": webhook_key,
                      "title": title,
                      "description": description,
                      "link": link,
                      "published": published.isoformat(),
                      "score": score
                  })

              if len(found) == county_found_before:
                  for fallback_story in google_news_official_fallback(county, index_url):
                      link = fallback_story["link"]
                      if link in seen:
                          continue
                      checked_links.add(link)
                      found.append({
                          "county": county,
                          "webhook_key": webhook_key,
                          "title": fallback_story["title"],
                          "description": fallback_story["description"],
                          "link": link,
                          "published": fallback_story["published"].isoformat(),
                          "score": fallback_story["score"]
                      })

          # Deduplicate and keep the strongest items first.
          unique = {}
          for item in found:
              unique[item["link"]] = item

          found = sorted(
              unique.values(),
              key=lambda x: (x["score"], x["published"]),
              reverse=True
          )

          # Do not write seen-state yet. A story should only become
          # "seen" after Discord has accepted the message successfully.

          per_county = {}
          for item in found:
              per_county.setdefault(item["webhook_key"], []).append(item)
          found = [
              item
              for webhook_key in per_county
              for item in per_county[webhook_key][:3]
          ]

          if not found:
              # No Discord delivery is needed, so it is safe to persist the
              # links we checked and filtered out.
              for link in checked_links:
                  seen.setdefault(link, now.isoformat())

              if len(seen) > 1000:
                  recent = sorted(seen.items(), key=lambda x: x[1], reverse=True)[:800]
                  seen = dict(recent)

              with open(STATE_PATH, "w", encoding="utf-8") as f:
                  json.dump(seen, f, indent=2)

              print("No new qualifying county stories found.")
              raise SystemExit(0)

          def story_emoji(item):
              text = (item["title"] + " " + item["description"]).lower()

              if re.search(r"\bchampions?|title|promot(?:ed|ion)|relegat(?:ed|ion)\b", text):
                  return "🏆"
              if re.search(r"\bhat[- ]trick|five[- ]for|wicket haul\b", text):
                  return "🎯"
              if re.search(r"\b\d{3}\b|\bcentur(?:y|ies)\b|double hundred", text):
                  return "💯"
              if re.search(r"\bone[- ]wicket|thriller|dramatic|last[- ]wicket|final[- ]day\b", text):
                  return "🔥"
              if re.search(r"\bwin(?:s|ning)?|victory|defeat|beaten\b", text):
                  return "🏏"
              return "📰"

          # Deliver one bulletin per county, to that county's webhook.
          delivered_links = set()
          delivery_errors = []

          for county, _, _, webhook_key in COUNTIES:
              county_items = [item for item in found if item["webhook_key"] == webhook_key]
              if not county_items:
                  continue

              lines = [
                  f"🏏 **{county} County Watch - {now.strftime('%d %B %Y')}**",
                  f"*Here are the latest stories from {county} County Cricket Club.*",
                  ""
              ]

              for item in county_items:
                  summary = item["description"]
                  if len(summary) > 260:
                      summary = summary[:257].rsplit(" ", 1)[0] + "..."
                  emoji = story_emoji(item)

                  if summary:
                      lines.append(f"{emoji} **{item['title']}** {summary}")
                  else:
                      lines.append(f"{emoji} **{item['title']}**")

                  source_label = item.get("source", "Official county site")
                  lines.append(
                      f"*{source_label} ·* **[Read the full story →]({item['link']})**"
                  )
                  lines.append("")

              message = "\n".join(lines)
              if len(message) > 1900:
                  message = message[:1897].rsplit("\n", 1)[0] + "..."

              print(message)

              webhook = webhooks[webhook_key]
              request = urllib.request.Request(
                  webhook,
                  data=json.dumps({"content": message, "flags": 4}).encode("utf-8"),
                  headers={
                      "Content-Type": "application/json",
                      "User-Agent": "Mozilla/5.0 (County Championship Discord Bot)"
                  },
                  method="POST"
              )
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      print(f"{county} Discord response: {response.status}")
                      delivered_links.update(item["link"] for item in county_items)
              except urllib.error.HTTPError as e:
                  body = e.read().decode("utf-8", errors="replace")
                  error = f"{county} Discord webhook HTTP {e.code}: {body}"
                  print(error)
                  delivery_errors.append(error)
              except Exception as e:
                  error = f"{county} Discord webhook failed: {e}"
                  print(error)
                  delivery_errors.append(error)

          # Only mark stories as seen after their county's Discord delivery succeeds.
          for link in delivered_links:
              seen.setdefault(link, now.isoformat())

          if len(seen) > 1000:
              recent = sorted(seen.items(), key=lambda x: x[1], reverse=True)[:800]
              seen = dict(recent)

          with open(STATE_PATH, "w", encoding="utf-8") as f:
              json.dump(seen, f, indent=2)

          if delivery_errors:
              raise SystemExit("One or more county Discord deliveries failed.")
          PY

      - name: Save seen-state
        run: |
          # The state file may be new on the first successful run, so
          # git diff alone is not enough: untracked files do not appear in
          # git diff. Stage it first, then check the staged diff.
          git add data/county-watch-seen.json

          if git diff --cached --quiet -- data/county-watch-seen.json; then
            echo "No state changes to commit."
            exit 0
          fi

          git config user.name "County Championship Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update county website watch state"
          git push
